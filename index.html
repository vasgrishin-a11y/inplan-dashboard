<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>S&OP Planning Result · In.Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
<style>
/* ═══════════════ ТОКЕНЫ In.Plan ═══════════════ */
:root{
  /* neutral 0…950 */
  --scp-n-0:#ffffff;--scp-n-50:#f5f6f8;--scp-n-100:#eaeaea;--scp-n-150:#dfdfe0;
  --scp-n-200:#d4d5d6;--scp-n-300:#bfbfc1;--scp-n-500:#949598;--scp-n-600:#77787a;
  --scp-n-700:#5a5a5c;--scp-n-800:#3c3d3e;--scp-n-900:#1f1f20;--scp-n-950:#111111;
  /* brand 50…950, ядро 700 */
  --scp-b-50:#faf3ff;--scp-b-100:#f4e3ff;--scp-b-200:#eacdff;--scp-b-300:#d899ff;
  --scp-b-400:#c46cff;--scp-b-500:#af35ff;--scp-b-600:#9c0fff;--scp-b-700:#9000ff;
  --scp-b-800:#6f00ce;--scp-b-900:#4f0096;--scp-b-950:#410076;
  /* прикладные роли акцента */
  --scp-accent:#9000ff;--scp-accent-hover:#7320d9;--scp-accent-active:#822be2;
  --scp-accent-sub:#af47ff;--scp-accent-2:#c57aff;--scp-accent-bd:#e9ccff;
  --scp-accent-bg:#f1e0ff;--scp-accent-dis:#d8cfde;
  /* поверхности */
  --scp-bg:#f4f3f7;--scp-surface:#ffffff;--scp-surface-2:#f9f8fb;--scp-rail:#17171a;
  --scp-rail-2:#2a2a30;--scp-rail-hover:#242429;
  /* текст */
  --scp-text:#212529;--scp-text-2:#444647;--scp-text-3:#8c9096;--scp-text-dis:#d9d9d9;
  --scp-link:#0d56e2;
  /* границы */
  --scp-line:#e8e7ee;--scp-line-2:#dedce5;--scp-divider:#cbcbcb;--scp-ctrl:#949598;
  --scp-ctrl-hover:#5a5a5c;--scp-menu-bd:#cfd4dc;
  /* семантика */
  --scp-ok:#22bb55;--scp-ok-bg:#d2faef;--scp-err:#f22a41;--scp-err-bg:#ffd6db;
  --scp-warn:#ff9a3b;--scp-warn-bg:#fcf0d4;
  /* палитра данных */
  --dat-1:#2d3f8f;--dat-2:#3fa9c9;--dat-3:#22bb55;--dat-4:#ff9a3b;--dat-5:#f22a41;
  --dat-6:#7c5cd6;--dat-7:#0d9488;--dat-8:#c026a3;--dat-9:#8a8f98;
  /* геометрия */
  --r-s:4px;--r-m:8px;--r-l:16px;
  --p-1:4px;--p-2:8px;--p-3:12px;--p-4:16px;--p-6:24px;--p-8:32px;
  --rail-w:212px;--rail-w-min:56px;
}

/* ═══════════════ ИЗЯЩНАЯ ТЁМНАЯ ТЕМА In.Plan ═══════════════ */
[data-theme="dark"]{
  /* мягкий графитовый фон с благородным полутоном */
  --scp-bg:#1a1a22;--scp-surface:#22222c;--scp-surface-2:#292936;
  --scp-rail:#15151c;--scp-rail-2:#2f2f3d;--scp-rail-hover:#252533;
  /* контрастная и комфортная для глаз типографика */
  --scp-text:#f1f2f6;--scp-text-2:#c4c6d4;--scp-text-3:#8f92a4;--scp-text-dis:#525464;
  --scp-link:#4d88ff;
  /* тонкие, чёткие границы */
  --scp-line:#2d2d3a;--scp-line-2:#383849;--scp-divider:#434357;--scp-ctrl:#616378;
  --scp-ctrl-hover:#9a9cb2;--scp-menu-bd:#434357;
  /* фирменный акцент InPlan */
  --scp-b-50:#2d1945;--scp-b-100:#431e68;--scp-b-200:#5d2491;
  --scp-accent:#a846ff;--scp-accent-hover:#962bf9;--scp-accent-active:#be6bff;
  --scp-accent-sub:#c47aff;--scp-accent-2:#d79aff;--scp-accent-bd:#6e2da8;
  --scp-accent-bg:#3a195a;
  /* семантические фоны */
  --scp-ok:#2dd468;--scp-ok-bg:#143823;
  --scp-err:#f84b5c;--scp-err-bg:#42171c;
  --scp-warn:#fb9e38;--scp-warn-bg:#41290f;
  --scp-n-50:#292936;--scp-n-100:#313140;
}

[data-theme="dark"] .dq.e{background:var(--scp-err-bg)}
[data-theme="dark"] .dq.w{background:var(--scp-warn-bg)}
[data-theme="dark"] .dq.i{background:var(--scp-ok-bg)}
[data-theme="dark"] #tip{background:#15151c;border:1px solid var(--scp-line-2)}
[data-theme="dark"] input[type=number]{background:var(--scp-surface);color:var(--scp-text)}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--scp-bg);color:var(--scp-text);
  font:400 14px/20px 'Open Sans',-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;transition:background .2s ease,color .2s ease}

/* ═══════════════ КАРКАС: тёмный рельс + рабочая область ═══════════════ */
.app{display:flex;min-height:100vh}
.rail{width:var(--rail-w);flex:0 0 var(--rail-w);background:var(--scp-rail);
  display:flex;flex-direction:column;transition:width .2s ease-in-out, flex-basis .2s ease-in-out;position:sticky;top:0;height:100vh;z-index:300}
.app.min .rail{width:var(--rail-w-min);flex:0 0 var(--rail-w-min)}
.rail-logo{display:flex;align-items:center;padding:16px 14px 10px;min-height:56px}
.inplan-badge{display:flex;align-items:center;gap:3px;padding:6px;border-radius:6px;
  background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07)}
.ip-sq{width:11px;height:11px;border-radius:2.5px;transition:transform .2s ease}
.inplan-badge:hover .ip-sq{transform:scale(1.08)}
.ip-s1{background:var(--scp-accent);box-shadow:0 0 8px rgba(144,0,255,0.6)}
.ip-s2{background:var(--scp-accent-sub)}
.ip-s3{background:var(--scp-accent-2)}
.ip-s4{background:#fff;opacity:0.9}
.app.min .rail-sub,.app.min .rail-nav b,.app.min .rail-grp{display:none}
.rail-sub{color:#8a8a8a;font-size:11px;padding:0 16px 12px;letter-spacing:.2px}
.rail-grp{color:#77787a;font-size:11px;font-weight:600;text-transform:uppercase;
  letter-spacing:.6px;padding:10px 16px 6px}
.rail-nav{display:flex;flex-direction:column;overflow-y:auto;flex:1;padding-bottom:8px}
.rail-nav button{display:flex;align-items:center;gap:10px;background:transparent;border:0;
  border-left:4px solid transparent;color:#d6d6d6;text-align:left;padding:9px 14px 9px 12px;
  font:400 13px/18px 'Open Sans',sans-serif;cursor:pointer;transition:.15s;white-space:nowrap;overflow:hidden}
.rail-nav button:hover{background:var(--scp-rail-hover);color:#fff}
.rail-nav button.on{background:var(--scp-rail-2);border-left-color:var(--scp-accent);color:#fff;font-weight:600}
.rail-nav .dot{width:6px;height:6px;border-radius:50%;background:var(--scp-warn);flex:0 0 6px}
.rail-nav button.on .dot{background:var(--scp-accent-sub)}
.rail-foot{border-top:1px solid #2e2e2e;padding:8px}
.rail-foot button{width:100%;background:transparent;border:0;color:#8a8a8a;cursor:pointer;
  font:400 12px 'Open Sans',sans-serif;padding:7px 8px;border-radius:var(--r-s);text-align:left;
  display:flex;align-items:center;justify-content:center}
.rail-foot button:hover{background:var(--scp-rail-hover);color:#fff}
.wrap{flex:1;min-width:0;display:flex;flex-direction:column}

/* ═══════════════ ШАПКА СТРАНИЦЫ ═══════════════ */
header{background:var(--scp-surface);border-bottom:1px solid var(--scp-line-2);
  padding:14px 32px 12px;display:flex;align-items:flex-start;gap:16px}
.hdr-left{display:flex;align-items:flex-start;gap:12px}
.btn-rail-menu{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;
  background:var(--scp-surface);border:1px solid var(--scp-ctrl);border-radius:var(--r-s);
  color:var(--scp-text-2);cursor:pointer;transition:.12s;margin-top:2px}
.btn-rail-menu:hover{border-color:var(--scp-accent);color:var(--scp-accent);background:var(--scp-b-50)}
.btn-rail-menu svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
h1{font:600 28px/34px 'Open Sans',sans-serif;margin:0;color:var(--scp-text)}
.h-sub{font-size:12px;line-height:16px;color:var(--scp-text-3);margin-top:2px}
.hdr-actions{display:flex;align-items:center;gap:6px;margin-left:auto}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;
  background:var(--scp-surface);border:1px solid var(--scp-ctrl);border-radius:var(--r-s);
  color:var(--scp-text-2);cursor:pointer;transition:.12s;position:relative}
.icon-btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round}
.icon-btn:hover{border-color:var(--scp-accent);color:var(--scp-accent);background:var(--scp-b-50)}
.icon-btn.p{background:var(--scp-accent);border-color:var(--scp-accent);color:#fff}
.icon-btn.p:hover{background:var(--scp-accent-hover);border-color:var(--scp-accent-hover);color:#fff}
.icon-btn.d:hover{border-color:var(--scp-err);color:var(--scp-err);background:var(--scp-err-bg)}
.icon-btn[data-tip]::after{content:attr(data-tip);position:absolute;top:calc(100% + 7px);left:50%;
  transform:translateX(-50%);background:var(--scp-n-900);color:#fff;font-size:12px;line-height:16px;
  white-space:nowrap;padding:5px 9px;border-radius:var(--r-s);opacity:0;pointer-events:none;
  transition:opacity .15s;z-index:500}
.icon-btn[data-tip]:hover::after{opacity:1}
.stat{font-size:12px;line-height:16px;color:var(--scp-text-3);text-align:right;white-space:nowrap;
  align-self:center}

/* ═══════════════ ПАНЕЛЬ ФИЛЬТРОВ ═══════════════ */
.fpanel{background:var(--scp-surface);border-bottom:1px solid var(--scp-line-2);
  padding:8px 32px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:52px}
.fbar-lbl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;
  color:var(--scp-text-3);margin-right:2px}
.fbar-left,.fbar-mid,.fbar-right{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.fbar-right{margin-left:auto}
.fbar-divider{width:1px;height:22px;background:var(--scp-line-2);margin:0 4px}
.pop-wrap{position:relative}
.pill-btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;
  background:var(--scp-surface);border:1px solid var(--scp-ctrl);border-radius:var(--r-s);
  font:400 13px 'Open Sans',sans-serif;color:var(--scp-text);cursor:pointer;transition:.12s}
.pill-btn:hover{border-color:var(--scp-ctrl-hover)}
.pill-btn.on{background:var(--scp-accent-bg);border-color:var(--scp-accent);color:var(--scp-b-900)}
.pill-lbl{color:var(--scp-text-3);font-weight:400}
.pill-val{font-weight:600}
.pill-badge{background:var(--scp-accent);color:#fff;font-size:11px;font-weight:700;padding:0 6px;
  border-radius:9999px;height:18px;display:inline-flex;align-items:center}
.pill-badge.hide{display:none}
.pill-arr{font-size:8px;color:var(--scp-text-3)}
.pop-menu{display:none;position:absolute;top:calc(100% + 6px);left:0;min-width:252px;
  background:var(--scp-surface);border:1px solid var(--scp-menu-bd);border-radius:var(--r-m);
  box-shadow:0 4px 15px #00000026;padding:8px;z-index:250}
.pop-wrap.open .pop-menu{display:block}
.pop-hdr{display:flex;justify-content:space-between;align-items:center;padding:2px 4px 7px;
  font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;
  color:var(--scp-text-3);border-bottom:1px solid var(--scp-line)}
.pop-hdr-links{display:flex;gap:10px}
.pop-hdr-links a{color:var(--scp-accent);text-decoration:none;cursor:pointer;font-size:11px;
  font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.pop-hdr-links a:hover{color:var(--scp-accent-hover)}
.pop-q{width:100%;background:var(--scp-surface);color:var(--scp-text);border:1px solid var(--scp-ctrl);
  border-radius:var(--r-s);padding:6px 9px;font:400 13px 'Open Sans',sans-serif;margin:7px 0 4px}
.pop-q:focus{outline:none;border-color:var(--scp-accent)}
.pop-list{max-height:236px;overflow-y:auto;display:flex;flex-direction:column;gap:1px}
.pop-item{padding:6px 8px;border-radius:var(--r-s);font-size:13px;cursor:pointer;
  color:var(--scp-text);display:flex;align-items:center;gap:9px;user-select:none}
.pop-item:hover{background:var(--scp-b-50)}
.pop-item.on{background:var(--scp-accent-bg);font-weight:600}
.pop-item input[type=checkbox]{cursor:pointer;accent-color:var(--scp-accent);margin:0;width:14px;height:14px}
.pop-item span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn-reset-flt{display:inline-flex;align-items:center;height:32px;padding:0 12px;background:transparent;
  border:0;border-radius:var(--r-s);font:600 12px 'Open Sans',sans-serif;text-transform:uppercase;
  letter-spacing:.4px;color:var(--scp-accent);cursor:pointer}
.btn-reset-flt:hover:not(:disabled){background:var(--scp-b-50)}
.btn-reset-flt:disabled{color:var(--scp-text-dis);cursor:default}

/* ═══════════════ КОНТЕНТ ═══════════════ */
main{padding:20px 32px 72px;flex:1}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--scp-surface);border:1px solid var(--scp-line-2);border-radius:var(--r-m);
  padding:14px 16px}
.kpi .t{font-size:13px;line-height:18px;color:var(--scp-text-2)}
.kpi .v{font:700 28px/34px 'Open Sans',sans-serif;color:var(--scp-text);margin-top:6px;
  letter-spacing:-.4px}
.kpi .s{font-size:12px;line-height:16px;color:var(--scp-text-3);margin-top:3px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(440px,1fr))}
.card{background:var(--scp-surface);border:1px solid var(--scp-line-2);border-radius:var(--r-m);
  padding:16px 18px 12px;min-width:0}
.card.w{grid-column:1/-1}
.card h3{margin:0;font:600 15px/20px 'Open Sans',sans-serif;color:var(--scp-text)}
.card .sub{font-size:12px;line-height:16px;color:var(--scp-text-3);margin:3px 0 10px}
canvas{width:100%;display:block;cursor:pointer}
.lg{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--scp-text-2);
  padding:2px 0 8px;justify-content:center}
.lg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:0}

/* ═══════════════ ТАБЛИЦЫ ═══════════════ */
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:0 8px;height:32px;text-align:right;border-bottom:1px solid var(--scp-line);
  white-space:nowrap;line-height:16px}
th{height:36px;color:var(--scp-text-2);font-size:13px;font-weight:600;position:sticky;top:0;
  background:var(--scp-surface);z-index:2}
tbody tr:hover{background:var(--scp-b-50)}
.scr{max-height:340px;overflow:auto;border:1px solid var(--scp-line);border-radius:var(--r-s)}
.pos{color:var(--scp-ok)}.neg{color:var(--scp-err)}.mid{color:#c47512}
.dt-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 10px}
.dt-q{background:var(--scp-surface);color:var(--scp-text);border:1px solid var(--scp-ctrl);
  border-radius:var(--r-s);padding:6px 10px;font:400 13px 'Open Sans',sans-serif;width:240px}
.dt-q:focus{outline:none;border-color:var(--scp-accent)}
.dt-info{font-size:12px;color:var(--scp-text-3)}
.dt-btn{background:var(--scp-surface);color:var(--scp-text-2);border:1px solid var(--scp-ctrl);
  border-radius:var(--r-s);padding:5px 10px;font:400 12px 'Open Sans',sans-serif;cursor:pointer}
.dt-btn:hover{border-color:var(--scp-accent);color:var(--scp-accent);background:var(--scp-b-50)}
.dt-btn.off,.dt-btn:disabled{opacity:.45;cursor:default}
.dt-btn.off:hover,.dt-btn:disabled:hover{border-color:var(--scp-ctrl);color:var(--scp-text-2);
  background:var(--scp-surface)}
.dt-chip{background:var(--scp-accent-bg);border:1px solid var(--scp-accent-bd);color:var(--scp-b-900);
  border-radius:9999px;padding:3px 10px;font-size:12px;cursor:pointer}
.dt-chip:hover{background:var(--scp-err-bg);border-color:var(--scp-err);color:var(--scp-err)}
.dt th.dt-th{padding-right:18px;white-space:nowrap}
.dt td,.dt th{text-align:right}
.dt td.l,.dt th.dt-th.l{text-align:left}
.dt .dt-t{cursor:pointer;user-select:none}
.dt .dt-t:hover{color:var(--scp-accent)}
.dt-ar{color:var(--scp-n-300);margin-left:5px;font-size:9px}
.dt-fn{cursor:pointer;margin-left:6px;color:var(--scp-n-300);font-size:10px}
.dt-fn:hover,.dt-fn.on{color:var(--scp-accent)}
.dt-pgs{display:flex;gap:6px;align-items:center;justify-content:flex-end;margin-top:10px;
  font-size:12px;color:var(--scp-text-3)}
#dtpop{display:none;position:fixed;z-index:600;width:260px;background:var(--scp-surface);
  border:1px solid var(--scp-menu-bd);border-radius:var(--r-m);box-shadow:0 4px 15px #00000026;padding:10px}
.dtp-h{display:flex;justify-content:space-between;align-items:center;font-size:11px;
  font-weight:600;color:var(--scp-text-3);text-transform:uppercase;letter-spacing:.5px;
  padding-bottom:6px;border-bottom:1px solid var(--scp-line)}
.dtp-x{cursor:pointer}.dtp-x:hover{color:var(--scp-err)}
.dtp-q{width:100%;background:var(--scp-surface);color:var(--scp-text);border:1px solid var(--scp-ctrl);
  border-radius:var(--r-s);padding:6px 9px;font:400 13px 'Open Sans',sans-serif;margin:7px 0 5px}
.dtp-q:focus{outline:none;border-color:var(--scp-accent)}
.dtp-a{display:flex;gap:6px;margin-bottom:5px}
.dtp-a button{flex:1;background:var(--scp-surface);color:var(--scp-text-2);
  border:1px solid var(--scp-ctrl);border-radius:var(--r-s);padding:5px 0;font-size:12px;cursor:pointer}
.dtp-a button:hover{border-color:var(--scp-accent);color:var(--scp-accent)}
.dtp-l{max-height:220px;overflow-y:auto;display:flex;flex-direction:column;gap:1px}
.dtp-i{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:var(--r-s);
  font-size:13px;cursor:pointer}
.dtp-i:hover{background:#eee7f3}
.dtp-i.on{color:var(--scp-b-900);font-weight:600}
.dtp-i input{accent-color:var(--scp-accent);margin:0;width:14px;height:14px}
.dtp-i span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dtp-e{padding:12px;text-align:center;color:var(--scp-text-3);font-size:12px}

/* ═══════════════ ПРОЧИЕ КОМПОНЕНТЫ ═══════════════ */
.btn{background:var(--scp-surface);color:var(--scp-text);border:1px solid var(--scp-ctrl);
  border-radius:var(--r-s);padding:7px 14px;cursor:pointer;font:400 13px 'Open Sans',sans-serif;
  transition:.12s}
.btn:hover{background:var(--scp-n-50);border-color:var(--scp-ctrl-hover)}
.btn.p{background:var(--scp-accent);color:#fff;border-color:var(--scp-accent);font-weight:600}
.btn.p:hover{background:var(--scp-accent-hover);border-color:var(--scp-accent-hover)}
.btn.d{background:var(--scp-surface);border-color:var(--scp-err);color:var(--scp-err)}
.btn.d:hover{background:var(--scp-err-bg)}
.chip{background:var(--scp-surface);border:1px solid var(--scp-ctrl);border-radius:9999px;

input[type=number]{font-family:'Open Sans',sans-serif}
.frow{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px}

.sum{background:var(--scp-surface);border:1px solid var(--scp-line-2);

.sum h4{margin:0 0 10px;font:600 15px/20px 'Open Sans',sans-serif;color:var(--scp-text)}

.sum .h{color:var(--scp-text);font-weight:600}
.sec{font-size:11px;color:var(--scp-text-3);text-transform:uppercase;letter-spacing:.6px;

#tip{position:fixed;pointer-events:none;background:var(--scp-n-900);color:#fff;

#tip b{color:var(--scp-accent-2)}
#tip code{background:#333;padding:1px 4px;border-radius:3px;font-size:11px}
.dq{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:var(--r-m);
  margin-bottom:8px;font-size:13.5px;line-height:19px;border:1px solid var(--scp-line-2);

.dq.e{border-left:4px solid var(--scp-err);background:#fffafb}
.dq.w{border-left:4px solid var(--scp-warn);background:#fffdf8}
.dq.i{border-left:4px solid var(--scp-ok);background:#fafffc}
.dq .m{flex:1}
.dq b{color:var(--scp-text)}
.empty{text-align:center;padding:72px 24px;color:var(--scp-text-3);font-size:14px;
  background:var(--scp-surface);border:1px solid var(--scp-line-2);border-radius:var(--r-m)}
.empty h2{font:600 20px/26px 'Open Sans',sans-serif;color:var(--scp-text);margin:0 0 8px}
.tbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:6px 10px;
  background:var(--scp-n-50);border:1px solid var(--scp-line-2);border-radius:var(--r-m)}
.tbar-lbl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;
  color:var(--scp-text-3);margin-right:4px}
.seg{display:inline-flex;background:var(--scp-n-50);border:1px solid var(--scp-line-2);
  border-radius:var(--r-s);padding:2px}
.seg .btn{border:0;background:transparent;padding:5px 11px;font-size:12.5px;border-radius:3px}

/* Цвет текста поверх заливки: контрастно в обеих темах */
function onFill(hex){
  if(!hex||hex[0]!=='#')return CH.txt;
  const h=hex.length===4?hex.replace(/#(.)(.)(.)/,'#$1$1$2$2$3$3'):hex;
  const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(4,6),16);
  return (0.299*r+0.587*g+0.114*b)>138?'#15151c':'#ffffff';
}
/* rgba из hex */
function rgba(hex,a){const h=hex.replace('#','');
  const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);
  return `rgba(${r},${g},${b},${a})`}

/* ═══════════════ 3.1. УНИВЕРСАЛЬНАЯ ТАБЛИЦА ═══════════════ */
const TBL={};
let DTP=null;
function dtp(){if(!DTP){DTP=document.createElement('div');DTP.id='dtpop';
  DTP.onclick=e=>e.stopPropagation();document.body.appendChild(DTP)}return DTP}
function dtpHide(){if(DTP)DTP.style.display='none'}

function dtable(sel,cols,rows,opts){
  opts=opts||{};
  const host=$(sel); if(!host) return;
  const key=(opts.key||sel).replace(/[^A-Za-z0-9_]/g,'');
  if(!TBL[key]) TBL[key]={sort:opts.sort||cols[0].k,dir:opts.dir||'desc',q:'',flt:{},pg:1};
  const st=TBL[key];

  const data=rows.map(r=>{const o={_r:r};cols.forEach(c=>{o[c.k]=c.v?c.v(r):r[c.k]});return o});
  const cell=(c,d)=>c.f?c.f(d[c.k],d._r)
    :(d[c.k]===''||d[c.k]==null?'—':(typeof d[c.k]==='number'?nf(d[c.k],2):esc(d[c.k])));
  const plain=(c,d)=>String(cell(c,d)).replace(/<[^>]*>/g,'').trim();

  function view(){
    let out=data;
    cols.forEach(c=>{const s=st.flt[c.k];
      if(s&&s.length){const set=new Set(s);out=out.filter(d=>set.has(String(d[c.k]==null?'':d[c.k])))}});
    const q=st.q.trim().toLowerCase();
    if(q)out=out.filter(d=>cols.some(c=>plain(c,d).toLowerCase().includes(q)));
    const sc=cols.find(c=>c.k===st.sort);
    if(sc){const dir=st.dir==='asc'?1:-1;
      out=out.slice().sort((a,b)=>{const x=a[sc.k],y=b[sc.k];
        const nx=typeof x==='number',ny=typeof y==='number';
        if(sc.num||(nx&&ny))return((nx?x:0)-(ny?y:0))*dir;
        return String(x==null?'':x).localeCompare(String(y==null?'':y),'ru',{numeric:true})*dir})}
    return out;
  }
  const uqv=c=>[...new Set(data.map(d=>String(d[c.k]==null?'':d[c.k])))]
    .sort((a,b)=>a.localeCompare(b,'ru',{numeric:true}));

  function draw(){
    const out=view(), pg=opts.pg||0;
    const tp=pg?Math.max(1,Math.ceil(out.length/pg)):1;
    st.pg=Math.min(Math.max(1,st.pg),tp);
    const slice=pg?out.slice((st.pg-1)*pg,st.pg*pg):out.slice(0,opts.max||4000);
    const actC=cols.filter(c=>st.flt[c.k]&&st.flt[c.k].length);
    const nAct=actC.length+(st.q?1:0);

    host.innerHTML=`<div class="dt">
      <div class="dt-bar">
        <input class="dt-q" type="text" placeholder="Поиск по таблице" value="${esc(st.q)}">
        <span class="dt-info">${nf(out.length)} из ${nf(data.length)}${pg?` · стр. ${st.pg} из ${tp}`:''}</span>
        ${actC.map(c=>`<span class="dt-chip" data-cf="${c.k}">${esc(c.t)}: ${st.flt[c.k].length} ✕</span>`).join('')}
        <span style="flex:1"></span>
        ${opts.csv?`<button class="dt-btn" data-csv="1">Экспорт CSV</button>`:''}
        <button class="dt-btn ${nAct?'':'off'}" data-clr="1" ${nAct?'':'disabled'}>Сбросить</button>
      </div>
      <div class="scr" style="max-height:${opts.h||340}px"><table><thead><tr>
        ${cols.map(c=>{const on=st.sort===c.k,fon=st.flt[c.k]&&st.flt[c.k].length;
          return `<th class="dt-th${c.left?' l':''}"><span class="dt-t" data-sk="${c.k}">${esc(c.t)}
            <span class="dt-ar">${on?(st.dir==='asc'?'▲':'▼'):'↕'}</span></span>${
            c.flt?`<span class="dt-fn${fon?' on':''}" data-fk="${c.k}">▾</span>`:''}</th>`}).join('')}
      </tr></thead><tbody>
        ${slice.length?slice.map(d=>`<tr>${cols.map(c=>
          `<td class="${c.cls?(c.cls(d[c.k],d._r)||''):''}${c.left?' l':''}">${cell(c,d)}</td>`).join('')}</tr>`).join('')
          :`<tr><td colspan="${cols.length}" style="text-align:center;padding:26px;color:var(--scp-text-3)">Ничего не найдено</td></tr>`}
      </tbody></table></div>
      ${pg&&tp>1?`<div class="dt-pgs">
        <button class="dt-btn" data-pg="1">«</button>
        <button class="dt-btn" data-pg="${st.pg-1}">Назад</button>
        <span>${st.pg} из ${tp}</span>
        <button class="dt-btn" data-pg="${st.pg+1}">Вперёд</button>
        <button class="dt-btn" data-pg="${tp}">»</button></div>`:''}
    </div>`;

    const qi=host.querySelector('.dt-q');
    qi.oninput=()=>{const p=qi.selectionStart;st.q=qi.value;st.pg=1;draw();
      const n=host.querySelector('.dt-q');n.focus();n.selectionStart=n.selectionEnd=p};
    host.querySelectorAll('.dt-t').forEach(e=>e.onclick=()=>{
      const k=e.dataset.sk;
      if(st.sort===k)st.dir=st.dir==='asc'?'desc':'asc';else{st.sort=k;st.dir='desc'}
      draw()});
    host.querySelectorAll('.dt-fn').forEach(e=>e.onclick=ev=>{ev.stopPropagation();openFlt(e,e.dataset.fk)});
    host.querySelectorAll('[data-cf]').forEach(e=>e.onclick=()=>{st.flt[e.dataset.cf]=[];st.pg=1;draw()});
    const clr=host.querySelector('[data-clr]');
    if(clr)clr.onclick=()=>{st.q='';st.flt={};st.pg=1;draw()};
    host.querySelectorAll('[data-pg]').forEach(e=>e.onclick=()=>{st.pg=+e.dataset.pg;draw()});
    const cb=host.querySelector('[data-csv]');
    if(cb)cb.onclick=()=>{
      const lines=[cols.map(c=>c.t).join(';')]
        .concat(out.map(d=>cols.map(c=>`"${plain(c,d).replace(/"/g,'""')}"`).join(';')));
      const b=new Blob(['\uFEFF'+lines.join('\r\n')],{type:'text/csv;charset=utf-8;'});
      const a=document.createElement('a');a.href=URL.createObjectURL(b);
      a.download=(opts.name||'table')+'_'+new Date().toISOString().slice(0,10)+'.csv';a.click()};
  }

  function openFlt(anchor,k){
    const c=cols.find(z=>z.k===k),P=dtp(),vals=uqv(c);
    let fq='';
    const build=()=>{
      const list=vals.filter(v=>!fq||v.toLowerCase().includes(fq));
      const cur=st.flt[k]||[];
      P.innerHTML=`<div class="dtp-h"><span>${esc(c.t)}</span><span class="dtp-x">✕</span></div>
        <input class="dtp-q" type="text" placeholder="Поиск значения" value="${esc(fq)}">
        <div class="dtp-a"><button data-all="1">Выбрать все</button><button data-non="1">Снять все</button></div>
        <div class="dtp-l">${list.map(v=>{const on=cur.includes(v);
          return `<label class="dtp-i${on?' on':''}"><input type="checkbox" ${on?'checked':''} data-v="${esc(v)}">
            <span>${esc(v===''?'(пусто)':v)}</span></label>`}).join('')||'<div class="dtp-e">нет значений</div>'}</div>`;
      P.querySelector('.dtp-x').onclick=dtpHide;
      const fi=P.querySelector('.dtp-q');
      fi.oninput=()=>{const p=fi.selectionStart;fq=fi.value.toLowerCase();build();
        const n=P.querySelector('.dtp-q');n.value=fq?fi.value:'';n.focus();n.selectionStart=n.selectionEnd=p};
      P.querySelector('[data-all]').onclick=()=>{st.flt[k]=list.slice();st.pg=1;draw();build()};
      P.querySelector('[data-non]').onclick=()=>{st.flt[k]=[];st.pg=1;draw();build()};
      P.querySelectorAll('input[type=checkbox]').forEach(i=>i.onchange=()=>{
        const s=new Set(st.flt[k]||[]);
        i.checked?s.add(i.dataset.v):s.delete(i.dataset.v);
        st.flt[k]=[...s];st.pg=1;draw();build()});
    };
    build();
    P.style.display='block';
    const r=anchor.getBoundingClientRect();
    P.style.left=Math.max(8,Math.min(r.left-12,innerWidth-272))+'px';
    P.style.top=Math.min(r.bottom+6,Math.max(8,innerHeight-370))+'px';
  }

  draw();
}

/* ═══════════════ 4. ПОДГОТОВКА ДАТАСЕТА ═══════════════ */
function build(src){
  const CLEAN=['loc','prod','cl'];
  const o=src.orders.map(r=>{const x={...r,chan:String(r.loc).startsWith('Sale_EX')?'EX':'RU'};
    CLEAN.forEach(k=>x[k]=esc(x[k]));return x});
  const ops=src.ops.map(r=>{const x={...r,type:TMAP[r.t]||r.t,cost:(Math.abs(r.r)<=1?0:Math.abs(r.r)*r.v),
    stub:Math.abs(r.r)<=1,tclass:TCLASS[r.tm]||r.tm||'—'};
    ['pl','pr','rs','fr','to','tm','vd','rt','oid'].forEach(k=>x[k]=esc(x[k]));return x});
  const om=new Map(o.map(x=>[x.id,x]));
  ops.forEach(r=>{const x=om.get(r.o);r.cl=x?x.cl:'';r.chan=x?x.chan:'';r.sprod=x?x.prod:''});
  return {name:src.name||'Датасет',orders:o,ops,ts:new Date().toISOString()};
}
function fOrders(excludeKey=null){
  return DS.orders.filter(o=>{
    if(excludeKey!=='p' && F.p.length && !F.p.includes(String(o.p))) return false;
    if(excludeKey!=='ch' && F.ch.length && !F.ch.includes(o.chan)) return false;
    if(excludeKey!=='cl' && F.cl.length && !F.cl.includes(o.cl)) return false;
    if(excludeKey!=='pr' && F.pr.length && !F.pr.includes(o.prod)) return false;
    if(excludeKey!=='pi' && F.pi.length && !F.pi.includes(String(o.pr))) return false;
    if((excludeKey!=='pl' && F.pl.length) || (excludeKey!=='vd' && F.vd.length) ||
       (excludeKey!=='tm' && F.tm.length) || (excludeKey!=='nd' && F.nd.length)){
      const relOps = DS.ops.filter(r=>r.o===o.id);
      if(excludeKey!=='pl' && F.pl.length && !relOps.some(r=>F.pl.includes(r.pl))) return false;
      if(excludeKey!=='vd' && F.vd.length && !relOps.some(r=>F.vd.includes(r.vd))) return false;
      if(excludeKey!=='tm' && F.tm.length && !relOps.some(r=>F.tm.includes(r.tm))) return false;
      if(excludeKey!=='nd' && F.nd.length &&
         !relOps.some(r=>F.nd.includes(r.fr)||F.nd.includes(r.to)||F.nd.includes(r.pl))) return false;
    }
    return true;
  });
}
function fOps(excludeKey=null){
  const ords = fOrders(excludeKey);
  const ids = new Set(ords.map(o=>o.id));
  return DS.ops.filter(r=>{
    if(!ids.has(r.o)) return false;
    if(excludeKey!=='pl' && F.pl.length && !F.pl.includes(r.pl)) return false;
    if(excludeKey!=='vd' && F.vd.length && !F.vd.includes(r.vd)) return false;
    if(excludeKey!=='tm' && F.tm.length && !F.tm.includes(r.tm)) return false;
    if(excludeKey!=='nd' && F.nd.length &&
       !(F.nd.includes(r.fr)||F.nd.includes(r.to)||F.nd.includes(r.pl))) return false;
    return true;
  });
}

const POPQ={};
function fillSelects(){
  const o=DS.orders, ops=DS.ops;
  const renderPill=(wrapId,key,list,fmt)=>{
    const wrap=$(wrapId); if(!wrap) return;
    fmt=fmt||(v=>String(v));
    const btn=wrap.querySelector('.pill-btn'),
          valSpan=wrap.querySelector('.pill-val'),
          badge=wrap.querySelector('.pill-badge'),
          listEl=wrap.querySelector('.pop-list'),
          menu=wrap.querySelector('.pop-menu'),
          hdr=wrap.querySelector('.pop-hdr');
    const all=list.map(String), sel=F[key];

    btn.classList.toggle('on',!!sel.length);
    const one=sel.length===1?fmt(sel[0]):'';
    valSpan.textContent=!sel.length?'Все'
      :(sel.length===1?(one.length>16?one.slice(0,15)+'…':one)
        :sel.length+' '+plural(sel.length,['вариант','варианта','вариантов']));
    if(badge){badge.textContent=sel.length;badge.classList.toggle('hide',!sel.length)}

    const reopen=()=>{const w2=$(wrapId);if(!w2)return;
      w2.classList.add('open');const q2=w2.querySelector('.pop-q');if(q2)q2.focus()};

    const links=hdr?hdr.querySelector('.pop-hdr-links'):null;
    if(links){
      const aAll=links.querySelector('[data-act="all"]'), aClr=links.querySelector('[data-act="clr"]');
      if(aAll)aAll.onclick=e=>{e.stopPropagation();F[key]=all.slice();render();reopen()};
      if(aClr)aClr.onclick=e=>{e.stopPropagation();F[key]=[];render();reopen()};
    }

    let q=menu.querySelector('.pop-q');
    if(!q){
      q=document.createElement('input');q.className='pop-q';q.type='text';q.placeholder='Поиск';
      menu.insertBefore(q,listEl);
      q.onclick=e=>e.stopPropagation();
    }
    q.value=POPQ[key]||'';
    const applyQ=()=>{const s=(POPQ[key]||'').toLowerCase();
      listEl.querySelectorAll('.pop-item').forEach(it=>{
        it.style.display=it.dataset.lbl.toLowerCase().includes(s)?'':'none'})};
    q.oninput=()=>{POPQ[key]=q.value;applyQ()};

    listEl.innerHTML=all.length?all.map(v=>{const on=sel.includes(v),lbl=fmt(v);
      return `<div class="pop-item${on?' on':''}" data-val="${esc(v)}" data-lbl="${esc(lbl)}">
        <input type="checkbox" ${on?'checked':''}><span>${esc(lbl)}</span></div>`}).join('')
      :'<div class="dtp-e">нет значений</div>';
    applyQ();

    btn.onclick=e=>{
      e.stopPropagation();
      const was=wrap.classList.contains('open');
      $$('.pop-wrap').forEach(w=>w.classList.remove('open'));
      if(!was){wrap.classList.add('open');const qq=wrap.querySelector('.pop-q');if(qq)qq.focus()}
    };

    listEl.querySelectorAll('.pop-item').forEach(it=>{
      it.onclick=e=>{
        e.stopPropagation();
        const v=it.dataset.val,i=F[key].indexOf(v);
        i<0?F[key].push(v):F[key].splice(i,1);
        render();reopen();
      };
    });
  };

  renderPill('#pop_p','p',uq(o,x=>x.p).sort((a,b)=>a-b),v=>'P'+v);
  renderPill('#pop_ch','ch',['RU','EX'],v=>v==='RU'?'RU · внутренний':'EX · экспорт');
  renderPill('#pop_pi','pi',uq(o,x=>x.pr),v=>'Приоритет '+v);
  renderPill('#pop_cl','cl',uq(o,x=>x.cl));
  renderPill('#pop_pr','pr',uq(o,x=>x.prod));
  renderPill('#pop_pl','pl',uq(ops,x=>x.pl));
  renderPill('#pop_vd','vd',uq(ops,x=>x.vd));
  renderPill('#pop_tm','tm',uq(ops,x=>x.tm));

  const nAct=Object.values(F).reduce((s,a)=>s+a.length,0);
  const rBtn=$('#bResetFlt');
  if(rBtn){
    rBtn.disabled=!nAct;
    rBtn.textContent=nAct?`Сбросить (${nAct})`:'Сбросить';
    rBtn.onclick=()=>{clearF();render()};
  }
}

/* ═══════════════ 6. ГРАФИЧЕСКИЙ ДВИЖОК ═══════════════ */
const TIP=$('#tip');
const FNT='Open Sans, sans-serif';
function cv(id,h){
  const c=$(id);if(!c)return null;
  const r=Math.max(1,Math.min(devicePixelRatio||1,3));
  const w=Math.max(c.clientWidth||(c.parentElement?c.parentElement.clientWidth-36:0)||600,260);
  c.width=Math.round(w*r);
  c.height=Math.round(h*r);
  c.style.width='100%';
  c.style.height=h+'px';
  const x=c.getContext('2d');
  x.setTransform(r,0,0,r,0,0);
  x.clearRect(0,0,w,h);
  x.font='12px '+FNT;
  c._h=[];
  return {c,x,w,h};
}
function H(id,base,ratio=0.52,min=180,max=430){
  const c=$(id);if(!c)return base;
  const w=c.clientWidth||(c.parentElement?c.parentElement.clientWidth-36:0)||600;
  return Math.round(Math.max(min,Math.min(max,Math.max(base,w*ratio))));
}
function reg(c,x,y,w,h,html,cb){c._h.push({x,y,w,h,html,cb})}
function bind(c){
  c.onmousemove=e=>{const b=c.getBoundingClientRect(),mx=e.clientX-b.left,my=e.clientY-b.top;
    const hit=(c._h||[]).find(r=>mx>=r.x&&mx<=r.x+r.w&&my>=r.y&&my<=r.y+r.h);
    if(hit){TIP.innerHTML=hit.html;TIP.style.display='block';
      let L=e.clientX+14,T=e.clientY+14;
      if(L+TIP.offsetWidth>innerWidth-10)L=e.clientX-TIP.offsetWidth-14;
      if(T+TIP.offsetHeight>innerHeight-10)T=e.clientY-TIP.offsetHeight-14;
      TIP.style.left=L+'px';TIP.style.top=T+'px';c.style.cursor=hit.cb?'pointer':'default'}
    else{TIP.style.display='none';c.style.cursor='default'}};
  c.onmouseleave=()=>TIP.style.display='none';
  c.onclick=e=>{const b=c.getBoundingClientRect(),mx=e.clientX-b.left,my=e.clientY-b.top;
    const hit=(c._h||[]).find(r=>mx>=r.x&&mx<=r.x+r.w&&my>=r.y&&my<=r.y+r.h);if(hit&&hit.cb)hit.cb()};
}
function yAxis(x,w,h,p,max,fmt,n=5){x.strokeStyle=CH.grid;x.lineWidth=1;x.fillStyle=CH.axis;
  x.font='11px '+FNT;x.textAlign='right';x.textBaseline='middle';
  for(let i=0;i<=n;i++){const y=h-p.b-(h-p.t-p.b)*i/n;x.beginPath();x.moveTo(p.l,y);x.lineTo(w-p.r,y);x.stroke();
    x.fillText(fmt(max*i/n),p.l-7,y)}}
function xAxis(x,w,h,p,labs,rot){x.fillStyle=CH.lab;x.font='11px '+FNT;
  x.textAlign=rot?'right':'center';x.textBaseline='top';
  const bw=(w-p.l-p.r)/labs.length;
  labs.forEach((l,i)=>{const cx=p.l+bw*(i+.5),s=String(l).length>12?String(l).slice(0,11)+'…':l;
    if(rot){x.save();x.translate(cx,h-p.b+7);x.rotate(-.72);x.fillText(s,0,0);x.restore()}else x.fillText(s,cx,h-p.b+7)})}
/* Подпись значения над столбцом (числовая разметка, как в In.Plan) */

function chBars(id,h,labs,ser,fmt,tips,cb,rot,showLab){const g=cv(id,h);if(!g)return;const{c,x,w}=g;
  const p={l:64,r:16,t:showLab?24:14,b:rot?56:32},max=Math.max(...ser.flatMap(s=>s.v),1)*1.14;
  yAxis(x,w,h,p,max,fmt);xAxis(x,w,h,p,labs,rot);
  const bw=(w-p.l-p.r)/labs.length,iw=Math.max(bw*.72/ser.length,3);
  const lab=showLab&&labs.length<=9&&ser.length<=2;
  labs.forEach((l,i)=>{ser.forEach((s,si)=>{const hh=(h-p.t-p.b)*s.v[i]/max,bx=p.l+bw*i+bw*.14+iw*si;
    x.fillStyle=s.c;x.fillRect(bx,h-p.b-hh,iw-3,hh);
    if(lab&&s.v[i]>0)barLab(x,fmt(s.v[i]),bx+(iw-3)/2,h-p.b-hh-3)});
    reg(c,p.l+bw*i,p.t,bw,h-p.t-p.b,tips(i),cb?()=>cb(i):null)});

function chStackLine(id,h,labs,st,ln,fmtL,tips,cb,rot){const g=cv(id,h);if(!g)return;const{c,x,w}=g;
  const auto=rot||labs.some(l=>String(l).length>6);
  const p={l:64,r:52,t:22,b:auto?56:32},tot=labs.map((_,i)=>S(st,s=>s.v[i])),max=Math.max(...tot,1)*1.18;
  yAxis(x,w,h,p,max,fmtL);xAxis(x,w,h,p,labs,auto?1:0);

  const lab=labs.length<=9;
  labs.forEach((_,i)=>{let b=0;st.forEach(s=>{const hh=(h-p.t-p.b)*s.v[i]/max;x.fillStyle=s.c;
    x.fillRect(p.l+bw*i+(bw-iw)/2,h-p.b-b-hh,iw,hh);b+=hh});

  ln.v.forEach((v,i)=>{const X=p.l+bw*(i+.5),Y=h-p.b-(h-p.t-p.b)*Math.min(v,1);

function chLine(id,h,labs,ser,fmt,tips,cb){const g=cv(id,h);if(!g)return;const{c,x,w}=g;
  const p={l:68,r:18,t:24,b:32},all=ser.flatMap(s=>s.v),max=Math.max(...all,1)*1.2;
  yAxis(x,w,h,p,max,fmt);xAxis(x,w,h,p,labs);
  const sx=i=>p.l+(w-p.l-p.r)*(labs.length>1?i/(labs.length-1):.5),sy=v=>h-p.b-(h-p.t-p.b)*v/max;
  x.save();x.beginPath();x.rect(p.l-2,p.t-2,w-p.l-p.r+4,h-p.t-p.b+4);x.clip();
  ser.forEach(s=>{if(s.fill){const gr=x.createLinearGradient(0,p.t,0,h-p.b);
      gr.addColorStop(0,rgba(s.c,.20));gr.addColorStop(1,rgba(s.c,0));x.beginPath();
      s.v.forEach((v,i)=>i?x.lineTo(sx(i),sy(v)):x.moveTo(sx(i),sy(v)));

  x.restore();
  if(labs.length<=9&&ser.length===1)ser[0].v.forEach((v,i)=>barLab(x,fmt(v),sx(i),sy(v)-8));
  labs.forEach((_,i)=>reg(c,sx(i)-15,p.t,30,h-p.t-p.b,tips(i),cb?()=>cb(i):null));

function chH(id,h,items,fmt,cb){const g=cv(id,h);if(!g)return;const{c,x,w}=g;
  const p={l:140,r:92,t:8,b:8},max=Math.max(...items.map(i=>i.v),1),row=(h-p.t-p.b)/Math.max(items.length,1);

function chDonut(id,h,parts,title,fmt,cb){const g=cv(id,h);if(!g)return;const{c,x,w}=g;
  const narrow=w<360;

    const ma=a+sw/2;reg(c,cx+Math.cos(ma)*((R+r0)/2)-16,cy+Math.sin(ma)*((R+r0)/2)-12,32,24,
      `<b>${pt.k}</b><br>${fmt(pt.v)} · ${pc(pt.v/tot)}`,cb?()=>cb(pt):null);a+=sw});
  x.fillStyle=CH.txt;x.textAlign='center';x.textBaseline='middle';x.font='600 12px '+FNT;

function chBubble(id,h,pts,cb){const g=cv(id,h);if(!g)return;const{c,x,w}=g;
  const p={l:66,r:24,t:18,b:38},xm=Math.max(...pts.map(q=>q.x),1)*1.18;
  const L=v=>Math.log10(Math.max(v,1)),ymin=Math.max(1,Math.min(...pts.map(q=>q.y))*.55),ymax=Math.max(...pts.map(q=>q.y))*1.7;

  x.textAlign='center';x.textBaseline='top';

function chPareto(id,h,items,fmt,cb){const g=cv(id,h);if(!g)return;const{c,x,w}=g;
  const p={l:64,r:50,t:18,b:32},tot=S(items,i=>i.v)||1;let cm=0;const cums=items.map(i=>(cm+=i.v)/tot);
  const max=Math.max(...items.map(i=>i.v),1)*1.1;yAxis(x,w,h,p,max,fmt);
  const bw=(w-p.l-p.r)/Math.max(items.length,1);
  items.forEach((it,i)=>{const hh=(h-p.t-p.b)*it.v/max;
    x.fillStyle=cums[i]<=.8?CH.d1:CH.n300||'#bfbfc1';
    if(cums[i]>.8)x.fillStyle='#c9ccd1';

  RAIL:'🚂 Ж/Д',
  TRUCK:'🚚 Авто',
  SHIP:'🚢 Море',
  SHIPCONTAN:'🚢 Контейнер',
  INTERNAL:'🏭 Внутризавод',
  PORTHANDL:'⚓ Терминал/Порт',

function chFlow(id,h,legsList,fmt,cb){
  const g=cv(id,h);if(!g)return;const{c,x,w}=g;
  if(!legsList.length){
    x.fillStyle=CH.axis;x.textAlign='center';x.font='13px '+FNT;
    x.fillText('Нет данных по перемещениям',w/2,h/2);bind(c);return;
  }

  // Определение этапа узла для сквозного End-to-End потока (0: Исток/Завод -> 1: Хаб/Порт -> 2: Клиент/Сбыт)
  const getNodeStage=name=>{
    const s=String(name||'');
    if(s.startsWith('Sale_')||s.startsWith('Cust_')||s.includes('Клиент'))return 2;
    if(s.startsWith('Dispatch_')||s.startsWith('Port_')||s.startsWith('WH_')||s.startsWith('Hub_'))return 1;
    if(s.startsWith('Vendor_')||s.startsWith('Plant_'))return 0;
    return 1;
  };

  // Собираем уникальные узлы и их объёмы
  const nodeSet=new Set();
  legsList.forEach(l=>{nodeSet.add(l.fr);nodeSet.add(l.to)});
  const allNodes=[...nodeSet].map(name=>{
    const st=getNodeStage(name);
    const vOut=S(legsList.filter(l=>l.fr===name),l=>l.v);
    const vIn=S(legsList.filter(l=>l.to===name),l=>l.v);
    return {id:name,name,stage:st,vol:Math.max(vOut,vIn,1)};
  });

  // Коррекция стадий, если поток идет внутри одного уровня
  legsList.forEach(l=>{
    const src=allNodes.find(n=>n.id===l.fr);
    const dst=allNodes.find(n=>n.id===l.to);
    if(src&&dst&&src.stage>=dst.stage){
      if(src.stage===2&&dst.stage===2)src.stage=1;
      else if(dst.stage<=src.stage)dst.stage=Math.min(2,src.stage+1);
    }
  });

  const stages=[0,1,2].map(st=>allNodes.filter(n=>n.stage===st));
  // Если промежуточных хабов нет, оставляем 2 колонки
  const activeStages=stages.filter(cols=>cols.length>0);
  const numCols=activeStages.length;
  const p={l:18,r:18,t:42,b:24};
  const colW=(w-p.l-p.r)/Math.max(numCols,1);
  const cardW=Math.min(colW*0.62,175),cardH=34;
  const availH=h-p.t-p.b;

  const stageTitles=['1. Производство и поставщики','2. Хабы, порты и перевалка','3. Точки отгрузки клиентам'];
  const stageColIdx=[];

  // Заголовки стадий
  x.font='600 11px '+FNT;x.textAlign='center';
  stages.forEach((stNodes,stIdx)=>{
    if(!stNodes.length)return;
    const cIdx=stageColIdx.length;
    stageColIdx.push(stIdx);
    const cx=p.l+cIdx*colW+colW/2;
    x.fillStyle=stIdx===2?CH.ok:(stIdx===0?CH.d1:CH.d6);
    x.fillText(stageTitles[stIdx],cx,p.t-22);
    x.strokeStyle=CH.grid;x.lineWidth=1;x.setLineDash([3,3]);
    x.beginPath();x.moveTo(cx,p.t-10);x.lineTo(cx,h-p.b);x.stroke();x.setLineDash([]);
  });

  // Расчет координат карточек
  const nodeMap=new Map();
  activeStages.forEach((colNodes,cIdx)=>{
    const stIdx=stageColIdx[cIdx];
    colNodes.sort((a,b)=>b.vol-a.vol);
    const stepY=availH/Math.max(colNodes.length,1);
    colNodes.forEach((n,rIdx)=>{
      const curH=Math.min(cardH,stepY-6);
      n.x=p.l+cIdx*colW+(colW-cardW)/2;
      n.y=p.t+rIdx*stepY+(stepY-curH)/2;
      n.w=cardW;n.h=curH;
      n.color=stIdx===2?CH.ok:(stIdx===0?CH.d1:CH.d2);
      nodeMap.set(n.id,n);
    });
  });

  // Отрисовка лент потоков (Sankey Bezier)
  const maxLegVol=Math.max(...legsList.map(l=>l.v),1);
  legsList.slice().sort((a,b)=>a.v-b.v).forEach((l,i)=>{
    const src=nodeMap.get(l.fr),dst=nodeMap.get(l.to);
    if(!src||!dst)return;
    const sx=src.x+src.w,sy=src.y+src.h/2;
    const ex=dst.x,ey=dst.y+dst.h/2;
    const flowThick=Math.max(3,Math.min(22,(l.v/maxLegVol)*20));
    const dx=Math.max(24,Math.abs(ex-sx)*0.45);

    const grad=x.createLinearGradient(sx,sy,ex,ey);
    grad.addColorStop(0,rgba(src.color,0.38));
    grad.addColorStop(1,rgba(dst.color,0.38));

    x.beginPath();
    x.moveTo(sx,sy-flowThick/2);
    x.bezierCurveTo(sx+dx,sy-flowThick/2,ex-dx,ey-flowThick/2,ex,ey-flowThick/2);
    x.lineTo(ex,ey+flowThick/2);
    x.bezierCurveTo(ex-dx,ey+flowThick/2,sx+dx,sy+flowThick/2,sx,sy+flowThick/2);
    x.closePath();
    x.fillStyle=grad;x.fill();

    x.strokeStyle=rgba(src.color,0.6);x.lineWidth=1;
    x.beginPath();
    x.moveTo(sx,sy);
    x.bezierCurveTo(sx+dx,sy,ex-dx,ey,ex,ey);
    x.stroke();

    // Бейджик вида транспорта по центру потока
    const mx=(sx+ex)/2,my=(sy+ey)/2;
    const icoStr=TM_ICONS[l.tm]||l.tm||'Транспорт';
    const shortIco=icoStr.split(' ')[0]||'🚚';
    const tagW=22,tagH=18;
    drawBox(x,mx-tagW/2,my-tagH/2,tagW,tagH,3);
    x.fillStyle=CH.surf;x.fill();
    x.strokeStyle=CH.line;x.lineWidth=1;x.stroke();
    x.fillStyle=CH.txt;x.font='10px '+FNT;
    x.textAlign='center';x.textBaseline='middle';
    x.fillText(shortIco,mx,my+1);

    // Хитбокс для тултипа потока
    reg(c,mx-20,my-14,40,28,
      `<b>${l.fr} → ${l.to}</b><br>`
      +`Вид транспорта: <b>${icoStr}</b><br>`
      +`Объём потока: <b>${fmt(l.v)}</b><br>`
      +(l.c?`Затраты: <b>${bn(l.c)}</b><br>`:'')
      +(l.rate>1?`Тариф: <b>${nf(l.rate)} ₽/т</b>`:'Тариф: условие поставки/внутрисети'),
      null);
  });

  // Отрисовка карточек узлов
  allNodes.forEach(n=>{
    if(!n.w)return;
    x.fillStyle=CH.surf;
    drawBox(x,n.x,n.y,n.w,n.h,4);x.fill();
    x.strokeStyle=CH.line;x.lineWidth=1;x.stroke();

    // Цветовая плашка слева
    x.fillStyle=n.color;
    x.fillRect(n.x,n.y+3,4,n.h-6);

    // Название узла
    x.fillStyle=CH.txt;x.font='600 11px '+FNT;
    x.textAlign='left';x.textBaseline='top';
    const maxChars=Math.max(9,Math.floor((n.w-20)/7.2));
    const title=n.name.length>maxChars?n.name.slice(0,maxChars-1)+'…':n.name;
    x.fillText(title,n.x+9,n.y+4);

    // Тоннаж узла
    x.fillStyle=CH.sub;x.font='10px '+FNT;
    x.fillText(fmt(n.vol),n.x+9,n.y+18);

    reg(c,n.x,n.y,n.w,n.h,
      `<b>Узел: ${n.name}</b><br>`
      +`Сквозной объём: <b>${fmt(n.vol)}</b><br>`
      +`<span style="color:var(--scp-accent)">Клик: отфильтровать всю панель по узлу</span>`,
      cb?()=>cb(n.id):null);
  });

  bind(c);
}

function chDumbbell(id,h,items,fmt,cb){const g=cv(id,h);if(!g)return;const{c,x,w}=g;
  const p={l:126,r:100,t:10,b:10},max=Math.max(...items.flatMap(i=>[i.a,i.b]),1)*1.1,row=(h-p.t-p.b)/Math.max(items.length,1);
  items.forEach((it,i)=>{const y=p.t+row*(i+.5),X=v=>p.l+(w-p.l-p.r)*v/max;
    x.strokeStyle=CH.line;x.lineWidth=2.5;x.beginPath();
    x.moveTo(X(Math.min(it.a,it.b)),y);x.lineTo(X(Math.max(it.a,it.b)),y);x.stroke();
    x.fillStyle=CH.d1;x.beginPath();x.arc(X(it.a),y,5,0,7);x.fill();
    x.fillStyle=it.b>it.a?CH.err:CH.ok;x.beginPath();x.arc(X(it.b),y,5,0,7);x.fill();
    x.fillStyle=CH.lab;x.font='11.5px '+FNT;x.textAlign='right';x.textBaseline='middle';
    x.fillText(String(it.k).slice(0,17),p.l-8,y);
    x.fillStyle=CH.txt;x.font='600 11.5px '+FNT;x.textAlign='left';x.fillText(fmt(it.b),w-p.r+7,y);
    reg(c,0,y-row/2,w,row,it.tip,cb?()=>cb(it):null)});
  bind(c)}

/* ═══════════════ 9. БЛОК: СПРОС ═══════════════ */

  const D=fOrders();if(!D.length)return '<div class="empty">Нет данных под текущими фильтрами</div>';
  const rev=S(D,o=>o.rev),mar=S(D,o=>o.mar),cost=S(D,o=>o.cost),dem=S(D,o=>o.dem),sal=S(D,o=>o.sal),unm=S(D,o=>o.unm);
  const ex=D.filter(o=>o.chan==='EX'),ru=D.filter(o=>o.chan==='RU');
  const p1=D.filter(o=>o.pr==1);

   ['Неудовлетворённый спрос',nf(unm)+' т',pc(unm/dem),'neg'],
   ['Заказов с дефицитом',nf(D.filter(o=>o.unm>0).length),'требуют мощностей','mid'],
   ['Средняя цена',nf(rev/sal)+' ₽/т','взвешенно',''],
   ['Средняя себестоимость',nf(cost/sal)+' ₽/т','полная',''],
   ['Экспорт в марже',pc(S(ex,o=>o.mar)/mar),'канал EX',''],
   ['Service Level приоритета 1',p1.length?pc(S(p1,o=>o.sal)/S(p1,o=>o.dem)):'—','высший приоритет',p1.length&&S(p1,o=>o.sal)/S(p1,o=>o.dem)<.9?'neg':'pos']];
  const per=grp(D,o=>o.p,v=>({sal:S(v,o=>o.sal),unm:S(v,o=>o.unm),dem:S(v,o=>o.dem)})).sort((a,b)=>a.k-b.k);
  const def=grp(D.filter(o=>o.unm>0),o=>o.loc+' · '+o.prod,v=>({v:S(v,o=>o.unm),lm:S(v,o=>o.unm*o.mpt),prod:v[0].prod}))
    .sort((a,b)=>b.v-a.v).slice(0,8);
  const cl=grp(D,o=>o.cl,v=>({mar:S(v,o=>o.mar),sal:S(v,o=>o.sal),dem:S(v,o=>o.dem),unm:S(v,o=>o.unm),rev:S(v,o=>o.rev)}))
    .sort((a,b)=>b.mar-a.mar);
  const pr=grp(D,o=>o.prod,v=>({price:S(v,o=>o.price*o.sal)/S(v,o=>o.sal),cpt:S(v,o=>o.cost)/S(v,o=>o.sal),
    mar:S(v,o=>o.mar),sal:S(v,o=>o.sal)})).sort((a,b)=>b.price-a.price);
  const html=`
  <div class="kpis">${K.map(k=>`<div class="kpi"><div class="t">${k[0]}</div><div class="v ${k[3]}">${k[1]}</div><div class="s">${k[2]}</div></div>`).join('')}</div>
  <div class="grid">
    <div class="card"><h3>Спрос, продажи и дефицит</h3><div class="sub">Тыс. т и линия Service Level</div>
      <div class="lg"><span><i style="background:${CH.d3}"></i>Продажи</span><span><i style="background:${CH.d5}"></i>Дефицит</span><span><i style="background:${CH.warn}"></i>Service Level</span></div>
      <canvas id="d1"></canvas></div>
    <div class="card"><h3>Топ дефицитов: локация и продукт</h3><div class="sub">Клик — фильтр по продукту</div><canvas id="d2"></canvas></div>
    <div class="card"><h3>Доля каналов в марже</h3><div class="sub">Клик — фильтр по каналу</div><canvas id="d3"></canvas></div>
    <div class="card"><h3>Клиенты: маржа и покрытие спроса</h3><div class="sub">Столбец — маржа, линия — Service Level</div>
      <div class="lg"><span><i style="background:${CH.d1}"></i>Маржа</span><span><i style="background:${CH.warn}"></i>Service Level</span></div><canvas id="d4"></canvas></div>
    <div class="card"><h3>Цена и себестоимость по продуктам</h3><div class="sub">Синяя точка — цена, вторая — себестоимость. Длина отрезка равна марже</div><canvas id="d5"></canvas></div>
    <div class="card"><h3>Маржа по клиентам и периодам</h3><div class="sub">Тепловая карта, млн ₽</div><canvas id="d6"></canvas></div>
    <div class="card w"><h3>Дефициты и упущенная выгода</h3><div class="sub">Клик по заголовку — сортировка, значок ▾ — мультифильтр</div><div id="d7"></div></div>
  </div>`;
  setTimeout(()=>{
    chStackLine('#d1',H('#d1',270,0.48),per.map(p=>'P'+p.k),
      [{c:CH.d3,v:per.map(p=>p.sal)},{c:CH.d5,v:per.map(p=>p.unm)}],
      {c:CH.warn,v:per.map(p=>p.sal/p.dem)},v=>nf(v/1000,0)+'k',
      i=>`<b>P${per[i].k}</b><br>Продажи: ${nf(per[i].sal)} т<br>Дефицит: ${nf(per[i].unm)} т<br>Service Level: ${pc(per[i].sal/per[i].dem)}`,
      i=>setF('p',per[i].k));
    if(def.length)chH('#d2',H('#d2',270,0.55),def.map(d=>({k:d.k,v:d.v,c:CH.d5,prod:d.prod,
      tip:`<b>${d.k}</b><br>Дефицит: ${nf(d.v)} т<br>Упущенная маржа: ${bn(d.lm)}`})),v=>nf(v)+' т',it=>setF('pr',it.prod));
    else{const g=cv('#d2',200);if(g){g.x.fillStyle=CH.axis;g.x.textAlign='center';g.x.font='13px '+FNT;
      g.x.fillText('Дефицитов под текущими фильтрами нет',g.w/2,100)}}
    chDonut('#d3',H('#d3',230,0.55),[{k:'RU внутренний',v:S(ru,o=>o.mar),c:CH.d1},{k:'EX экспорт',v:S(ex,o=>o.mar),c:CH.d2}],
      'Маржа',bn,pt=>setF('ch',pt.k.startsWith('RU')?'RU':'EX'));
    chStackLine('#d4',H('#d4',230,0.45),cl.map(c=>c.k),[{c:CH.d1,v:cl.map(c=>c.mar)}],{c:CH.warn,v:cl.map(c=>c.sal/c.dem)},
      v=>nf(v/1e9,1)+' млрд',i=>`<b>${cl[i].k}</b><br>Маржа: ${bn(cl[i].mar)}<br>Маржа на тонну: ${nf(cl[i].mar/cl[i].sal)} ₽<br>Service Level: ${pc(cl[i].sal/cl[i].dem)}<br>Дефицит: ${nf(cl[i].unm)} т`,
      i=>setF('cl',cl[i].k));
    chDumbbell('#d5',H('#d5',290,0.6),pr.slice(0,9).map(p=>({k:p.k,a:p.price,b:p.cpt,
      tip:`<b>${p.k}</b><br>Цена: ${nf(p.price)} ₽/т<br>Себестоимость: ${nf(p.cpt)} ₽/т<br>Маржа на тонну: ${nf(p.price-p.cpt)} ₽<br>Маржинальность: ${pc(1-p.cpt/p.price)}`})),
      v=>nf(v/1000,0)+'k ₽',it=>setF('pr',it.k));
    const rws=uq(D,o=>o.cl),cls=uq(D,o=>o.p).sort((a,b)=>a-b);
    chHeat('#d6',H('#d6',290,0.55),rws,cls.map(c=>'P'+c),rws.map(r=>cls.map(c=>S(D.filter(o=>o.cl===r&&o.p==c),o=>o.mar))),bn,
      (r,c)=>{F.cl=[r];F.p=[String(c).slice(1)];render()});
    dtable('#d7',[
      {k:'loc',t:'Локация',left:1,flt:1},
      {k:'prod',t:'Продукт',left:1,flt:1},
      {k:'cl',t:'Клиент',left:1,flt:1},
      {k:'p',t:'Период',num:1,flt:1,f:v=>'P'+v},
      {k:'dem',t:'Спрос',num:1,f:v=>nf(v)},
      {k:'sal',t:'Продажи',num:1,f:v=>nf(v,1)},
      {k:'unm',t:'Дефицит',num:1,f:v=>nf(v,1),cls:()=>'neg'},
      {k:'cov',t:'Покрытие',num:1,v:o=>o.dem?o.sal/o.dem:0,f:v=>pc(v),cls:v=>v>.5?'mid':'neg'},
      {k:'mpt',t:'Маржа ₽/т',num:1,f:v=>nf(v)},
      {k:'lr',t:'Упущ. выручка',num:1,v:o=>o.unm*o.price,f:v=>mln(v)},
      {k:'lm',t:'Упущ. маржа',num:1,v:o=>o.unm*o.mpt,f:v=>mln(v),cls:()=>'neg'}
    ],D.filter(o=>o.unm>0),{key:'dm_def',sort:'lm',dir:'desc',h:340,csv:1,name:'deficits'});
  },0);
  const topDef=def[0],hiMar=D.slice().sort((a,b)=>b.mpt-a.mpt)[0];
  return html+summary('Резюме: спрос и продажи',[
    {t:'Выводы',i:[
      `Покрыто <span class="h">${pc(sal/dem)}</span> спроса. ${def.length?`Дефицит сконцентрирован: топ-позиция <span class="h">${topDef.k}</span> — ${nf(topDef.v)} т и ${bn(topDef.lm)} упущенной маржи`:'Дефицитов нет'}.`,
      `Экспорт даёт ${pc(S(ex,o=>o.sal)/sal)} объёма и <span class="h">${pc(S(ex,o=>o.mar)/mar)}</span> маржи — ${S(ex,o=>o.mar)/Math.max(S(ex,o=>o.sal),1)>mar/sal?'канал маржинальнее среднего':'канал менее маржинален, чем внутренний'}.`,
      `Самая маржинальная позиция на тонну: <span class="h">${hiMar.prod}</span>, ${nf(hiMar.mpt)} ₽/т, клиент ${hiMar.cl}.`,
      `Клиентская концентрация: ${cl[0].k} формирует ${pc(cl[0].mar/mar)} маржи.`]},
    {t:'Аномалии',i:[
      p1.length&&S(p1,o=>o.sal)/S(p1,o=>o.dem)<.9?`<span class="h">Приоритет 1 не обслужен полностью</span>: Service Level ${pc(S(p1,o=>o.sal)/S(p1,o=>o.dem))}. Для высшего приоритета это нарушение логики планирования — проверить ограничения по мощности и правила аллокации.`:`Приоритет 1 обслужен полностью — правила аллокации работают.`,
      def.length&&def[0].v/10000>.9?`Есть позиции с покрытием менее 10% спроса — фактически спрос игнорируется оптимизатором: вероятно, отсутствует доступный маршрут или мощность.`:`Критических нулевых покрытий не выявлено.`,
      `Сегмент «Прочие» агрегирует разнородных клиентов — искажает клиентскую аналитику и переговорные приоритеты.`,
      `Поле «Клиент» смешивает юрлица (Роснефть, Газпром) и географии (Вьетнам, Турция) — нужна нормализация в два измерения: клиент и рынок.`]},
    {t:'Рекомендации',i:[
      `Приоритизировать расшивку по <span class="h">упущенной марже</span>, а не по тоннам дефицита — порядок позиций в таблице выше уже это отражает.`,
      `Разделить справочник на «Клиент» и «Рынок или регион», распаковать «Прочие» минимум до топ-10 контрагентов.`,
      `Проверить причины низкого покрытия: нет мощности, нет сырья или отсутствует разрешённый маршрут. Это три разных управленческих решения.`,
      `Для позиций с маржинальностью выше 90% валидировать корректность разузлования — такая маржа обычно означает недоучтённую себестоимость.`]}]);
}

/* ═══════════════ 10. БЛОК: ЛОГИСТИКА ═══════════════ */
function tabLG(){
  const O=fOps().filter(r=>r.type==='movement');
  if(!O.length)return '<div class="empty">Нет операций перемещения под текущими фильтрами</div>';
  const real=O.filter(r=>!r.stub);
  const cost=S(real,r=>r.cost),vol=S(O,r=>r.v);
  const byM=grp(O,r=>r.tm,v=>({c:S(v,r=>r.cost),v:S(v,r=>r.v),rate:S(v.filter(x=>!x.stub),r=>r.cost)/Math.max(S(v.filter(x=>!x.stub),r=>r.v),1)}))
    .sort((a,b)=>b.c-a.c);
  const byC=grp(O,r=>r.tclass,v=>({c:S(v,r=>r.cost),v:S(v,r=>r.v)})).sort((a,b)=>b.c-a.c);
  const legs=grp(O,r=>r.fr+' → '+r.to,v=>({c:S(v,r=>r.cost),v:S(v,r=>r.v),fr:v[0].fr,to:v[0].to,tm:v[0].tm,
    rate:S(v.filter(x=>!x.stub),r=>r.cost)/Math.max(S(v.filter(x=>!x.stub),r=>r.v),1)})).sort((a,b)=>b.c-a.c);
  const totCost=S(fOps(),r=>r.cost);
  const legsPerOrder=grp(O,r=>r.o,v=>({n:v.length}));
  const K=[['Затраты на логистику',bn(cost),pc(cost/Math.max(totCost,1))+' затрат цепочки',''],
   ['Перемещено',nf(vol)+' т',O.length+' '+plural(O.length,['операция','операции','операций']),''],
   ['Средний тариф',nf(cost/Math.max(S(real,r=>r.v),1))+' ₽/т','без строк-заглушек',''],
   ['Плеч на заказ',nf(S(legsPerOrder,l=>l.n)/legsPerOrder.length,1),'индикатор перевалки',
     S(legsPerOrder,l=>l.n)/legsPerOrder.length>6?'mid':''],
   ['Строк-заглушек',pc(O.filter(r=>r.stub).length/O.length),'тариф не более 1 ₽/т','mid'],
   ['Уникальных плеч',nf(legs.length),'узлов сети: '+uq(O,r=>r.fr).length,'']];
  const html=`
  <div class="kpis">${K.map(k=>`<div class="kpi"><div class="t">${k[0]}</div><div class="v ${k[3]||''}">${k[1]}</div><div class="s">${k[2]}</div></div>`).join('')}</div>
  <div class="grid">
    <div class="card"><h3>Затраты по виду транспорта</h3><div class="sub">Клик — фильтр по виду</div><canvas id="l1"></canvas></div>
    <div class="card"><h3>Класс операции перемещения</h3><div class="sub">Транспорт, внутризаводское, терминал, условие поставки</div><canvas id="l2"></canvas></div>
    <div class="card w"><h3>Потоки сети: откуда и куда</h3><div class="sub">Толщина потока — тонны. Клик по узлу — фильтр по узлу сети, снимается кнопкой «Сбросить» в панели фильтров</div><canvas id="l3"></canvas></div>
    <div class="card"><h3>Топ плеч по затратам</h3><div class="sub">Клик — фильтр по виду транспорта плеча</div><canvas id="l4"></canvas></div>
    <div class="card"><h3>Тариф по видам транспорта</h3><div class="sub">Только реальные ставки, ₽/т</div><canvas id="l5"></canvas></div>
    <div class="card w"><h3>Матрица плеч</h3><div class="sub">Тонны, затраты и удельный тариф. Сортировка и мультифильтры</div><div id="l6"></div></div>
  </div>`;
  setTimeout(()=>{
    chH('#l1',H('#l1',240,0.5),byM.map((m,i)=>({k:m.k,v:m.c,c:PAL[i%PAL.length],
      tip:`<b>${m.k}</b><br>Затраты: ${bn(m.c)}<br>Объём: ${nf(m.v)} т<br>Тариф: ${nf(m.rate)} ₽/т<br>Класс: ${TCLASS[m.k]||'—'}`})),bn,it=>setF('tm',it.k));
    chDonut('#l2',H('#l2',240,0.55),byC.map((c,i)=>({k:c.k,v:c.c,c:PAL[i]})),'Затраты',bn,null);
    const flowLegs=legs.filter(l=>l.fr&&l.to).slice(0,18);
    if(flowLegs.length) chFlow('#l3',H('#l3',340,0.34,300,440),flowLegs,v=>nf(v)+' т',k=>setF('nd',k));
    else{const g=cv('#l3',190);if(g){g.x.fillStyle=CH.axis;g.x.textAlign='center';g.x.font='13px '+FNT;
      g.x.fillText('Нет плеч с заполненными полями «откуда» и «куда»',g.w/2,95)}}
    chH('#l4',H('#l4',260,0.55),legs.slice(0,9).map(l=>({k:l.k,v:l.c,tm:l.tm,c:CH.d1,
      tip:`<b>${l.k}</b><br>${l.tm} · ${nf(l.v)} т<br>Затраты: ${bn(l.c)}<br>Тариф: ${nf(l.rate)} ₽/т`})),bn,it=>setF('tm',it.tm));
    const rm=byM.filter(m=>m.rate>1).sort((a,b)=>b.rate-a.rate);
    chBars('#l5',H('#l5',260,0.45),rm.map(m=>m.k),[{c:CH.d6,v:rm.map(m=>m.rate)}],v=>nf(v/1000,1)+'k',
      i=>`<b>${rm[i].k}</b><br>Тариф: ${nf(rm[i].rate)} ₽/т<br>Объём: ${nf(rm[i].v)} т`,i=>setF('tm',rm[i].k),1,1);
    dtable('#l6',[
      {k:'fr',t:'Откуда',left:1,flt:1},
      {k:'to',t:'Куда',left:1,flt:1},
      {k:'tm',t:'Вид',flt:1},
      {k:'tc',t:'Класс',flt:1,v:l=>TCLASS[l.tm]||'—'},
      {k:'v',t:'Тонн',num:1,f:v=>nf(v)},
      {k:'c',t:'Затраты, млн',num:1,f:v=>nf(v/1e6,1)},
      {k:'rate',t:'Тариф ₽/т',num:1,f:v=>nf(v),cls:v=>v>10000?'neg':v>3000?'mid':''},
      {k:'n',t:'Операций',num:1}
    ],legs,{key:'lg_legs',sort:'c',dir:'desc',h:350,csv:1,name:'legs'});
  },0);
  const topLeg=legs[0],expensive=legs.filter(l=>l.rate>10000);
  const avgLegs=S(legsPerOrder,l=>l.n)/legsPerOrder.length;
  return html+summary('Резюме: логистика',[
    {t:'Выводы',i:[
      `Логистика составляет <span class="h">${bn(cost)}</span>, или ${pc(cost/Math.max(totCost,1))} затрат цепочки. Средний тариф ${nf(cost/Math.max(S(real,r=>r.v),1))} ₽/т.`,
      `Дороже всего плечо <span class="h">${topLeg.k}</span> (${topLeg.tm}): ${bn(topLeg.c)} при ${nf(topLeg.v)} т.`,
      `Доминирующий вид: <span class="h">${byM[0].k}</span> — ${pc(byM[0].c/Math.max(cost,1))} логистических затрат.`,
      `В среднем <span class="h">${nf(avgLegs,1)}</span> плеч на заказ; часть цепочек проходит три и более промежуточных узла.`]},
    {t:'Аномалии',i:[
      `<span class="h">${pc(O.filter(r=>r.stub).length/O.length)}</span> строк перемещения имеют тариф не более 1 ₽/т (LASTMILE, PLANTFCA, часть SUPTRAN) — это заглушки, а не реальные ставки. Логистические затраты по факту <span class="h">недооценены</span>.`,
      `Поле «Тип транспорта» смешивает виды транспорта (RAIL, TRUCK, SHIP) с условиями поставки (PLANTFCA) и операциями терминала (PORTHANDL) — метрики по транспорту без реклассификации некорректны.`,
      expensive.length?`Плечи с тарифом выше 10 000 ₽/т: ${expensive.slice(0,3).map(l=>l.k).join(' | ')} — проверить обоснованность маршрута.`:`Плеч с аномально высоким удельным тарифом не выявлено.`,
      `В строках перемещения поле «Ресурс» содержит локации, а не ресурсы — при соединении таблиц это даёт ложные связи.`]},
    {t:'Рекомендации',i:[
      `Заполнить реальные тарифы для LASTMILE и PLANTFCA либо вынести их в отдельную статью «условия поставки» — иначе себестоимость доставки до клиента искажена.`,
      `Ввести справочник: <span class="h">вид транспорта</span> и <span class="h">тип операции сети</span> (перевалка, внутризаводское, базис поставки) как два независимых поля.`,
      `Добавить в модель расстояние и время в пути — это откроет метрики тонно-километров, стоимости километра и утилизации, которые сейчас недоступны.`,
      `Проанализировать цепочки с пятью и более плечами на возможность прямой отгрузки: каждая перевалка добавляет и стоимость, и срок.`]}]);
}

/* ═══════════════ 11. БЛОК: ПРОИЗВОДСТВО ═══════════════ */
function tabPD(){
  const O=fOps().filter(r=>r.type==='production');
  if(!O.length)return '<div class="empty">Нет производственных операций под текущими фильтрами</div>';
  const cost=S(O,r=>r.cost),vol=S(O,r=>r.v),totCost=S(fOps(),r=>r.cost);
  const byPl=grp(O,r=>r.pl,v=>({c:S(v,r=>r.cost),v:S(v,r=>r.v),rc:S(v,r=>r.rc||0),
    rate:S(v,r=>r.cost)/Math.max(S(v,r=>r.v),1)})).sort((a,b)=>b.c-a.c);
  const byRs=grp(O.filter(r=>r.rc),r=>r.rs,v=>({rc:S(v,r=>r.rc),v:S(v,r=>r.v),pl:v[0].pl})).sort((a,b)=>b.rc-a.rc);
  const byRt=grp(O,r=>r.rt,v=>({c:S(v,r=>r.cost),v:S(v,r=>r.v),rate:S(v,r=>r.cost)/Math.max(S(v,r=>r.v),1),pl:v[0].pl,pr:v[0].pr}))
    .filter(r=>r.k).sort((a,b)=>b.rate-a.rate);
  const byPr=grp(O,r=>r.pr,v=>({c:S(v,r=>r.cost),v:S(v,r=>r.v),rate:S(v,r=>r.cost)/Math.max(S(v,r=>r.v),1)})).sort((a,b)=>b.c-a.c);
  const dep=grp(O,r=>r.dp,v=>({c:S(v,r=>r.cost),v:S(v,r=>r.v)})).sort((a,b)=>a.k-b.k);
  const multi=grp(O,r=>r.pr,v=>({pl:uq(v,x=>x.pl).length,rows:v})).filter(x=>x.pl>1);
  const K=[['Затраты на производство',bn(cost),pc(cost/Math.max(totCost,1))+' затрат цепочки',''],
   ['Объём операций',nf(vol)+' т',O.length+' '+plural(O.length,['операция','операции','операций']),''],
   ['Средний передел',nf(cost/Math.max(vol,1))+' ₽/т','взвешенно',''],
   ['Задействовано заводов',nf(byPl.length),uq(O,r=>r.rs).length+' '+plural(uq(O,r=>r.rs).length,['ресурс','ресурса','ресурсов']),''],
   ['Машино-часы',nf(S(O,r=>r.rc||0)),'по строкам с данными',''],
   ['Максимальная глубина BOM',nf(Math.max(...O.map(r=>r.dp||1))),'уровней разузлования','mid']];
  const html=`
  <div class="kpis">${K.map(k=>`<div class="kpi"><div class="t">${k[0]}</div><div class="v ${k[3]||''}">${k[1]}</div><div class="s">${k[2]}</div></div>`).join('')}</div>
  <div class="grid">
    <div class="card"><h3>Затраты по заводам</h3><div class="sub">Клик — фильтр по заводу</div><canvas id="p1"></canvas></div>
    <div class="card"><h3>Нагрузка ресурсов, машино-часы</h3><div class="sub">Доступная мощность в данных отсутствует, процент утилизации не рассчитывается</div><canvas id="p2"></canvas></div>
    <div class="card"><h3>Себестоимость передела по рецептам</h3><div class="sub">₽/т. Сравнение альтернативных маршрутов</div><canvas id="p3"></canvas></div>
    <div class="card"><h3>Затраты по уровню разузлования</h3><div class="sub">Где в BOM накапливается стоимость</div><canvas id="p4"></canvas></div>
    <div class="card"><h3>Затраты по заводам и продуктам</h3><div class="sub">Тепловая карта, млн ₽</div><canvas id="p5"></canvas></div>
    <div class="card"><h3>Топ полуфабрикатов по затратам</h3><div class="sub">Справочно, без фильтрации</div><canvas id="p6"></canvas></div>
    <div class="card w"><h3>Производственные маршруты</h3><div class="sub">Рецепт, продукт и ресурс. Сортировка и мультифильтры</div><div id="p7"></div></div>
  </div>`;
  setTimeout(()=>{
    chH('#p1',H('#p1',250,0.52),byPl.slice(0,9).map((p,i)=>({k:p.k||'—',v:p.c,c:PAL[i%PAL.length],
      tip:`<b>${p.k}</b><br>Затраты: ${bn(p.c)}<br>Объём: ${nf(p.v)} т<br>Передел: ${nf(p.rate)} ₽/т<br>Машино-часы: ${nf(p.rc)}`})),bn,it=>setF('pl',it.k));
    chH('#p2',H('#p2',250,0.52),byRs.slice(0,9).map(r=>({k:r.k,v:r.rc,c:CH.d6,pl:r.pl,
      tip:`<b>${r.k}</b><br>Завод: ${r.pl}<br>Машино-часы: ${nf(r.rc)}<br>Объём: ${nf(r.v)} т<br>Часов на тонну: ${nf(r.rc/Math.max(r.v,1),3)}`})),
      v=>nf(v)+' ч',it=>setF('pl',it.pl));
    chBars('#p3',H('#p3',260,0.48),byRt.slice(0,10).map(r=>r.k.slice(0,14)),
      [{c:CH.d4,v:byRt.slice(0,10).map(r=>r.rate)}],v=>nf(v/1000,0)+'k',
      i=>`<b>${byRt[i].k}</b><br>Передел: ${nf(byRt[i].rate)} ₽/т<br>Продукт: ${byRt[i].pr}<br>Завод: ${byRt[i].pl}<br>Объём: ${nf(byRt[i].v)} т`,
      i=>setF('pl',byRt[i].pl),1);
    chLine('#p4',H('#p4',260,0.45),dep.map(d=>'Ур. '+d.k),[{c:CH.d1,v:dep.map(d=>d.c),fill:1}],v=>nf(v/1e6,0)+' млн',
      i=>`<b>Уровень ${dep[i].k}</b><br>Затраты: ${bn(dep[i].c)}<br>Объём: ${nf(dep[i].v)} т<br>Операций: ${dep[i].n}`,null);
    const rr=byPl.slice(0,7).map(p=>p.k),cc=byPr.slice(0,8).map(p=>p.k);
    chHeat('#p5',H('#p5',270,0.5),rr,cc,rr.map(r=>cc.map(c=>S(O.filter(x=>x.pl===r&&x.pr===c),x=>x.cost))),bn,(r)=>setF('pl',r));
    chH('#p6',H('#p6',260,0.55),byPr.slice(0,9).map(p=>({k:p.k,v:p.c,c:CH.d2,
      tip:`<b>${p.k}</b><br>Затраты: ${bn(p.c)}<br>Объём: ${nf(p.v)} т<br>Удельно: ${nf(p.rate)} ₽/т`})),bn,null);
    dtable('#p7',[
      {k:'rt',t:'Рецепт или маршрут',left:1,flt:1},
      {k:'pr',t:'Продукт',left:1,flt:1},
      {k:'pl',t:'Завод',flt:1,left:1},
      {k:'rs',t:'Ресурс',left:1,flt:1},
      {k:'dp',t:'Уровень',num:1,flt:1},
      {k:'v',t:'Тонн',num:1,f:v=>nf(v,1)},
      {k:'r',t:'₽/т',num:1,f:v=>nf(v)},
      {k:'cost',t:'Затраты, млн',num:1,f:v=>nf(v/1e6,1)},
      {k:'rc',t:'Машино-часы',num:1,f:v=>v?nf(v,1):'—'}
    ],O,{key:'pd_routes',sort:'cost',dir:'desc',h:350,csv:1,name:'production'});
  },0);
  const maxRt=byRt[0]||{k:'—',rate:0,pr:'—',pl:'—'},topPl=byPl[0]||{k:'—',c:0};
  return html+summary('Резюме: производство',[
    {t:'Выводы',i:[
      `Производство составляет <span class="h">${bn(cost)}</span> (${pc(cost/Math.max(totCost,1))} затрат цепочки), средний передел ${nf(cost/Math.max(vol,1))} ₽/т.`,
      `Ключевая площадка: <span class="h">${topPl.k}</span> — ${pc(topPl.c/Math.max(cost,1))} производственных затрат.`,
      `Самый дорогой передел: <span class="h">${maxRt.k}</span> — ${nf(maxRt.rate)} ₽/т (${maxRt.pr} на ${maxRt.pl}).`,
      `Глубина разузлования достигает <span class="h">${Math.max(...O.map(r=>r.dp||1))}</span> уровней — стоимость накапливается каскадно, локальная экономия на нижнем уровне мультиплицируется вверх.`,
      multi.length?`Продукты, выпускаемые на нескольких площадках: ${multi.slice(0,3).map(m=>m.k).join(' | ')} — есть база для сравнения себестоимости заводов.`:`Мультизаводского выпуска одного продукта под фильтром не выявлено.`]},
    {t:'Аномалии',i:[
      `<span class="h">Мощности ресурсов отсутствуют в данных</span> — можно измерить только потреблённые машино-часы, но не загрузку. Узкие места формально не определяются.`,
      `Часть производственных операций имеет ставку 0 ₽/т (например, маршруты Scrap) — это либо безвозмездный возврат, либо пропуск данных; влияет на распределение себестоимости.`,
      `Мультиресурсные операции дублируют строку с тем же объёмом — при наивном суммировании объём производства завышается.`,
      `Поле «Источник поставки» фактически содержит идентификатор рецепта, а не поставщика — риск неверной интерпретации в отчётах.`]},
    {t:'Рекомендации',i:[
      `Добавить в выгрузку <span class="h">доступную мощность ресурса</span> по периодам — это откроет процент утилизации, выявление узких мест и обоснование инвестиций.`,
      `Для продуктов с мультизаводским выпуском построить регулярное сравнение передела и перевести объём на площадку с меньшей полной себестоимостью с учётом логистики до клиента.`,
      `Провести аудит альтернативных рецептов одного продукта: разница в ₽/т между маршрутами — прямой резерв экономии без инвестиций.`,
      `Переименовать поля: «Источник поставки» в «Маршрут или рецепт», разделить «Ресурс» на производственный ресурс и локацию — это снизит ошибки аналитики.`]}]);
}

/* ═══════════════ 12. БЛОК: ЗАКУПКИ ═══════════════ */
function tabPC(){
  const O=fOps().filter(r=>r.type==='procurement');
  if(!O.length)return '<div class="empty">Нет закупочных операций под текущими фильтрами</div>';
  const cost=S(O,r=>r.cost),vol=S(O,r=>r.v),totCost=S(fOps(),r=>r.cost);
  const byV=grp(O,r=>r.vd,v=>({c:S(v,r=>r.cost),v:S(v,r=>r.v),sku:uq(v,x=>x.pr).length,
    rate:S(v,r=>r.cost)/Math.max(S(v,r=>r.v),1)})).sort((a,b)=>b.c-a.c);
  const byM=grp(O,r=>r.pr,v=>({c:S(v,r=>r.cost),v:S(v,r=>r.v),vd:uq(v,x=>x.vd),
    rate:S(v,r=>r.cost)/Math.max(S(v,r=>r.v),1),min:Math.min(...v.map(x=>x.r)),max:Math.max(...v.map(x=>x.r))}))
    .sort((a,b)=>b.c-a.c);
  const byP=grp(O,r=>r.p,v=>({c:S(v,r=>r.cost),v:S(v,r=>r.v),rate:S(v,r=>r.cost)/Math.max(S(v,r=>r.v),1)})).sort((a,b)=>a.k-b.k);
  const infl=byM.filter(m=>m.max>m.min).map(m=>({...m,gr:m.max/m.min-1})).sort((a,b)=>b.gr-a.gr);
  const top3=byV.slice(0,3),conc=S(top3,v=>v.c)/Math.max(cost,1);
  const multiSrc=byM.filter(m=>m.vd.length>1);
  const K=[['Затраты на закупки',bn(cost),pc(cost/Math.max(totCost,1))+' затрат цепочки',''],
   ['Закуплено',nf(vol)+' т',O.length+' '+plural(O.length,['операция','операции','операций']),''],
   ['Средняя цена закупки',nf(cost/Math.max(vol,1))+' ₽/т','взвешенно',''],
   ['Поставщиков',nf(byV.length),uq(O,r=>r.pr).length+' '+plural(uq(O,r=>r.pr).length,['материал','материала','материалов']),''],
   ['Концентрация топ-3',pc(conc),top3.map(v=>v.k).join(' | '),conc>.6?'mid':''],
   ['Мультисорсинг',nf(multiSrc.length)+' SKU','имеют два и более поставщика',multiSrc.length?'pos':'mid']];
  const html=`
  <div class="kpis">${K.map(k=>`<div class="kpi"><div class="t">${k[0]}</div><div class="v ${k[3]||''}">${k[1]}</div><div class="s">${k[2]}</div></div>`).join('')}</div>
  <div class="grid">
    <div class="card"><h3>Парето поставщиков по затратам</h3><div class="sub">Клик — фильтр по поставщику</div><canvas id="c1"></canvas></div>
    <div class="card"><h3>Топ материалов по затратам</h3><div class="sub">Клик — фильтр по поставщику материала</div><canvas id="c2"></canvas></div>
    <div class="card"><h3>Разброс цены закупки по материалу</h3><div class="sub">От минимума к максимуму за горизонт</div><canvas id="c3"></canvas></div>
    <div class="card"><h3>Динамика цены закупки</h3><div class="sub">Средняя ₽/т по периодам</div><canvas id="c4"></canvas></div>
    <div class="card"><h3>Затраты по поставщикам и материалам</h3><div class="sub">Тепловая карта, млн ₽</div><canvas id="c5"></canvas></div>
    <div class="card"><h3>Доля поставщиков в объёме</h3><div class="sub">Тонны</div><canvas id="c6"></canvas></div>
    <div class="card w"><h3>Закупочный реестр</h3><div class="sub">Сортировка и мультифильтры по поставщику, материалу и периоду</div><div id="c7"></div></div>
  </div>`;
  setTimeout(()=>{
    chPareto('#c1',H('#c1',250,0.45),byV.map(v=>({k:v.k,v:v.c})),bn,it=>setF('vd',it.k));
    chH('#c2',H('#c2',250,0.52),byM.slice(0,9).map((m,i)=>({k:m.k,v:m.c,vd:m.vd[0],c:PAL[i%PAL.length],
      tip:`<b>${m.k}</b><br>Затраты: ${bn(m.c)}<br>Объём: ${nf(m.v,1)} т<br>Средняя цена: ${nf(m.rate)} ₽/т<br>Поставщики: ${m.vd.join(', ')}`})),bn,it=>setF('vd',it.vd));
    chDumbbell('#c3',H('#c3',260,0.55),infl.slice(0,9).map(m=>({k:m.k,a:m.min,b:m.max,
      tip:`<b>${m.k}</b><br>Минимум: ${nf(m.min)} ₽/т<br>Максимум: ${nf(m.max)} ₽/т<br>Разброс: <b>+${pc(m.gr)}</b><br>Поставщики: ${m.vd.join(', ')}`})),
      v=>nf(v/1000,0)+'k',null);
    chLine('#c4',H('#c4',260,0.45),byP.map(p=>'P'+p.k),[{c:CH.d4,v:byP.map(p=>p.rate),fill:1}],v=>nf(v/1000,0)+'k',
      i=>`<b>P${byP[i].k}</b><br>Средняя цена: ${nf(byP[i].rate)} ₽/т<br>Затраты: ${bn(byP[i].c)}<br>Объём: ${nf(byP[i].v,1)} т`,
      i=>setF('p',byP[i].k));
    const rr=byV.slice(0,7).map(v=>v.k),cc=byM.slice(0,8).map(m=>m.k);
    chHeat('#c5',H('#c5',260,0.5),rr,cc,rr.map(r=>cc.map(c=>S(O.filter(x=>x.vd===r&&x.pr===c),x=>x.cost))),bn,(r)=>setF('vd',r));
    chDonut('#c6',H('#c6',260,0.55),byV.slice(0,6).map((v,i)=>({k:v.k,v:v.v,c:PAL[i]})),'Тонны',v=>nf(v,1)+' т',pt=>setF('vd',pt.k));
    dtable('#c7',[
      {k:'vd',t:'Поставщик',left:1,flt:1},
      {k:'pr',t:'Материал',left:1,flt:1},
      {k:'p',t:'Период',num:1,flt:1,f:v=>'P'+v},
      {k:'v',t:'Тонн',num:1,f:v=>nf(v,2)},
      {k:'r',t:'Цена ₽/т',num:1,f:v=>nf(v),cls:v=>v>500000?'neg':v>150000?'mid':''},
      {k:'cost',t:'Затраты, млн',num:1,f:v=>nf(v/1e6,2)},
      {k:'dp',t:'Уровень BOM',num:1,flt:1}
    ],O,{key:'pc_reg',sort:'cost',dir:'desc',h:350,csv:1,name:'procurement'});
  },0);
  const inflAvg=byP.length>1?byP[byP.length-1].rate/byP[0].rate-1:0;
  const dearest=byM.slice().sort((a,b)=>b.rate-a.rate)[0];
  return html+summary('Резюме: закупки',[
    {t:'Выводы',i:[
      `Закупки составляют <span class="h">${bn(cost)}</span> (${pc(cost/Math.max(totCost,1))} затрат цепочки) на ${nf(vol)} т от ${byV.length} поставщиков.`,
      `Топ-3 поставщика концентрируют <span class="h">${pc(conc)}</span> затрат: ${top3.map(v=>v.k+' — '+pc(v.c/cost)).join(' | ')}.`,
      `Самый дорогой материал в удельном выражении — <span class="h">${dearest.k}</span>, ${nf(dearest.rate)} ₽/т.`,
      byP.length>1?`Средняя цена закупки за горизонт изменилась на <span class="h">${pc(inflAvg)}</span> — это заложенная в план инфляция снабжения.`:`Динамику цен по периодам под текущим фильтром оценить нельзя.`,
      `Мультисорсинг есть у ${multiSrc.length} материалов — потенциал переключения объёма между вендорами.`]},
    {t:'Аномалии',i:[
      infl.length?`Максимальный разброс цены внутри одного материала: <span class="h">${infl[0].k}, +${pc(infl[0].gr)}</span>. Требует проверки: это индексация во времени или разные условия у вендоров.`:`Существенного разброса цен внутри материалов не выявлено.`,

      `Часть материалов закупается микрообъёмами (менее одной тонны на операцию) при высокой цене — вероятны неучтённые минимальные партии и постоянные затраты на заказ.`,

    +summary('Резюме: запасы',[{t:'Наблюдение',i:['Под выбранным фильтром хранение не используется — оптимизатор работает в поток. Это снижает затраты на запасы, но повышает чувствительность к сбоям поставок.']}]);
  const cost=S(O,r=>r.cost),vol=S(O,r=>r.v),totCost=S(fOps(),r=>r.cost);
  const byPl=grp(O,r=>r.pl,v=>({c:S(v,r=>r.cost),v:S(v,r=>r.v),sku:uq(v,x=>x.pr).length})).sort((a,b)=>b.c-a.c);
  const byPr=grp(O,r=>r.pr,v=>({c:S(v,r=>r.cost),v:S(v,r=>r.v),steps:v.length})).sort((a,b)=>b.c-a.c);
  const byP=grp(O,r=>r.p,v=>({c:S(v,r=>r.cost),v:S(v,r=>r.v),n:v.length})).sort((a,b)=>a.k-b.k);
  const chains=grp(O,r=>r.o+'|'+r.pr+'|'+r.pl,v=>({steps:v.length,v:v[0].v,c:S(v,r=>r.cost),o:v[0].o,pr:v[0].pr,pl:v[0].pl}))
    .sort((a,b)=>b.steps-a.steps);
  const K=[['Затраты на хранение',bn(cost),pc(cost/Math.max(totCost,1))+' затрат цепочки',''],
   ['Тонно-периодов',nf(vol),O.length+' '+plural(O.length,['шаг','шага','шагов'])+' хранения',''],
   ['Ставка хранения',nf(cost/Math.max(vol,1))+' ₽ за тонну-период','средняя',''],
   ['Складских узлов',nf(byPl.length),uq(O,r=>r.rs).length+' локаций хранения',''],
   ['Максимальное пролёживание',nf(chains[0].steps)+' '+plural(chains[0].steps,['период','периода','периодов']),chains[0].pr+' на '+chains[0].pl,chains[0].steps>4?'neg':'mid'],
   ['Средняя длина хранения',nf(S(chains,c=>c.steps)/chains.length,1)+' периодов','по партиям','']];
  const html=`
  <div class="kpis">${K.map(k=>`<div class="kpi"><div class="t">${k[0]}</div><div class="v ${k[3]||''}">${k[1]}</div><div class="s">${k[2]}</div></div>`).join('')}</div>
  <div class="grid">
    <div class="card"><h3>Затраты на хранение по складам</h3><div class="sub">Клик — фильтр по заводу</div><canvas id="s1"></canvas></div>
    <div class="card"><h3>Что лежит на хранении</h3><div class="sub">Тонно-периоды по продуктам</div><canvas id="s2"></canvas></div>
    <div class="card"><h3>Динамика хранения по периодам</h3><div class="sub">Затраты и число операций</div><canvas id="s3"></canvas></div>
    <div class="card"><h3>Длительность пролёживания партий</h3><div class="sub">Число последовательных шагов хранения</div><canvas id="s4"></canvas></div>
    <div class="card w"><h3>Затраты по складам и продуктам</h3><div class="sub">Тепловая карта, млн ₽</div><canvas id="s5"></canvas></div>
    <div class="card w"><h3>Реестр хранения</h3><div class="sub">Партии. Сортировка и мультифильтры</div><div id="s6"></div></div>
  </div>`;
  setTimeout(()=>{
    chH('#s1',H('#s1',240,0.5),byPl.slice(0,9).map((p,i)=>({k:p.k,v:p.c,c:PAL[i%PAL.length],
      tip:`<b>${p.k}</b><br>Затраты: ${bn(p.c)}<br>Тонно-периодов: ${nf(p.v)}<br>SKU: ${p.sku}`})),bn,it=>setF('pl',it.k));
    chDonut('#s2',H('#s2',240,0.55),byPr.slice(0,6).map((p,i)=>({k:p.k,v:p.v,c:PAL[i]})),'Тонно-периоды',v=>nf(v)+' т·п',null);
    chBars('#s3',H('#s3',250,0.45),byP.map(p=>'P'+p.k),[{c:CH.d4,v:byP.map(p=>p.c)}],v=>nf(v/1e6,0)+' млн',
      i=>`<b>P${byP[i].k}</b><br>Затраты: ${bn(byP[i].c)}<br>Операций: ${byP[i].n}<br>Тонно-периодов: ${nf(byP[i].v)}`,
      i=>setF('p',byP[i].k),0,1);
    chH('#s4',H('#s4',250,0.52),chains.slice(0,9).map(c=>({k:c.pr+' · '+c.pl,v:c.steps,

      tip:`<b>${c.pr}</b> на ${c.pl}<br>Заказ №${c.o}<br>Периодов хранения: <b>${c.steps}</b><br>Объём: ${nf(c.v,1)} т<br>Затраты: ${mln(c.c)} ₽`})),
      v=>nf(v)+' пер.',it=>setF('pl',it.pl));
    const rr=byPl.slice(0,7).map(p=>p.k),cc=byPr.slice(0,8).map(p=>p.k);
    chHeat('#s5',H('#s5',260,0.42),rr,cc,rr.map(r=>cc.map(c=>S(O.filter(x=>x.pl===r&&x.pr===c),x=>x.cost))),bn,(r)=>setF('pl',r));
    dtable('#s6',[
      {k:'pl',t:'Склад',left:1,flt:1},
      {k:'pr',t:'Продукт',left:1,flt:1},
      {k:'o',t:'Заказ',num:1,flt:1,f:v=>'№'+v},
      {k:'steps',t:'Периодов',num:1,flt:1,cls:v=>v>4?'neg':v>2?'mid':''},
