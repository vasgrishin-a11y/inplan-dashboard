      {k:'c',t:'Затраты, млн',num:1,f:v=>nf(v/1e6,2)},
      {k:'dp',t:'Уровень BOM',num:1,flt:1,v:c=>c.rows&&c.rows[0]?c.rows[0].dp:0}
    ],chains,{key:'st_reg',sort:'steps',dir:'desc',h:340,csv:1,name:'stock'});
  },0);
  const long=chains.filter(c=>c.steps>=3);
  return html+summary('Резюме: запасы и склады',[
    {t:'Выводы',i:[
      `Хранение составляет <span class="h">${bn(cost)}</span> (${pc(cost/Math.max(totCost,1))} затрат цепочки) при ставке ${nf(cost/Math.max(vol,1))} ₽ за тонну-период.`,
      `Основной складской узел: <span class="h">${byPl[0].k}</span> — ${pc(byPl[0].c/Math.max(cost,1))} затрат на хранение.`,
      `Больше всего лежит <span class="h">${byPr[0].k}</span> — ${nf(byPr[0].v)} тонно-периодов.`,
      `Операции хранения появляются только в поздних периодах горизонта — модель начинает буферизировать по мере роста напряжённости в сети.`,
      long.length?`Партий с пролёживанием три и более периода: <span class="h">${long.length}</span>, максимум ${chains[0].steps}.`:`Длительного пролёживания не выявлено.`]},
    {t:'Аномалии',i:[
      chains[0].steps>=5?`<span class="h">Критично:</span> партия ${chains[0].pr} на ${chains[0].pl} лежит ${chains[0].steps} периодов подряд по ${nf(chains[0].c/Math.max(chains[0].steps,1)/Math.max(chains[0].v,1))} ₽/т за период — это оплата простоя, а не создание ценности.`:`Длительность хранения в пределах разумного.`,
      `Ставка хранения выглядит единой для всех складов и продуктов — реальные различия по типу склада и требованиям к условиям не учтены.`,
      `Столбец «Потреблённый запас» полностью пуст — связать хранение с последующим расходом невозможно, оборачиваемость не рассчитывается.`,
      `Нет остатков на начало и конец периода и норм страхового запаса — метрики покрытия недоступны.`]},
    {t:'Рекомендации',i:[
      `Разобрать причины длинных цепочек хранения: если это ожидание синхронизации с производством — сдвинуть график выпуска; если ожидание транспорта — пересмотреть расписание отгрузок.`,
      `Дифференцировать ставки хранения по складам и типам продукта — сейчас модель не различает дешёвый навал и дорогое условное хранение.`,
      `Добавить в выгрузку остатки на начало и конец периода и целевой уровень запаса — это откроет оборачиваемость, покрытие и оценку излишков.`,
      `Ввести показатель «стоимость пролёживания на тонну проданной продукции» и включить его в оценку сценариев наравне с логистикой.`]}]);
}

/* ═══════════════ 14. БЛОК: СРАВНЕНИЕ ВЕРСИЙ ═══════════════ */
function snap(ds){
  const o=ds.orders,ops=ds.ops,f=t=>ops.filter(r=>r.type===t);
  const m=(t)=>S(f(t),r=>r.cost);
  return {name:ds.name,ts:ds.ts,orders:o.length,
    rev:S(o,x=>x.rev),cost:S(o,x=>x.cost),mar:S(o,x=>x.mar),dem:S(o,x=>x.dem),sal:S(o,x=>x.sal),unm:S(o,x=>x.unm),
    lm:S(o,x=>x.unm*x.mpt),full:o.filter(x=>!x.unm).length,
    pd:m('production'),mv:m('movement'),pc:m('procurement'),st:m('stock'),
    opsN:ops.length,plants:uq(ops,r=>r.pl).length,vendors:uq(ops,r=>r.vd).length};
}
function getVers(){try{return JSON.parse(localStorage.getItem('sop_vers')||'[]')}catch(e){return []}}
function saveVer(){const v=getVers();v.unshift(snap(DS));localStorage.setItem('sop_vers',JSON.stringify(v.slice(0,12)));
  alert('Версия сохранена: '+DS.name+'\nВсего версий: '+Math.min(v.length,12));if(TAB==='vs')render()}
function fmtTs(ts){if(!ts)return '';const d=new Date(ts);const p=n=>String(n).padStart(2,'0');
  return `${p(d.getDate())}.${p(d.getMonth()+1)}.${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`}

  const list=[{...cur,name:'Текущая: '+cur.name,_cur:1},...V];
  const gi=(k,def)=>{const s=sessionStorage.getItem(k);const n=s===null?def:parseInt(s,10);
    return isFinite(n)&&n>=0?n:def};
  const iA=gi('vA',Math.min(1,list.length-1)),iB=gi('vB',0);
  const A=list[Math.min(iA,list.length-1)],B=list[Math.min(iB,list.length-1)];
  const d=(a,b)=>b-a, r=(a,b)=>a?b/a-1:0;
  const rows=[
    ['Валовая выручка',A.rev,B.rev,bn,1],['Себестоимость',A.cost,B.cost,bn,-1],['Валовая маржа',A.mar,B.mar,bn,1],
    ['Маржинальность',A.mar/A.rev,B.mar/B.rev,pc,1],['Маржа на тонну',A.mar/A.sal,B.mar/B.sal,v=>nf(v)+' ₽',1],

    ['Service Level',A.sal/A.dem,B.sal/B.dem,pc,1],['Упущенная маржа',A.lm,B.lm,bn,-1],
    ['Затраты: производство',A.pd,B.pd,bn,-1],['Затраты: логистика',A.mv,B.mv,bn,-1],
    ['Затраты: закупки',A.pc,B.pc,bn,-1],['Затраты: хранение',A.st,B.st,bn,-1],

  const opt=(sel)=>list.map((v,i)=>`<option value="${i}" ${((sel===0?iB:iA)===i)?'selected':''}>${esc(v.name)}${v.ts?(' | '+fmtTs(v.ts)):''}</option>`).join('');

      `Service Level ${(B.sal/B.dem)>=(A.sal/A.dem)?'улучшился':'ухудшился'}: ${pc(A.sal/A.dem)} против <span class="h">${pc(B.sal/B.dem)}</span>. Неудовлетворённый спрос ${d(A.unm,B.unm)<=0?'сократился':'вырос'} на ${nf(Math.abs(d(A.unm,B.unm)))} т.`,
      `Себестоимость ${d(A.cost,B.cost)<=0?'снизилась':'выросла'} на ${bn(Math.abs(d(A.cost,B.cost)))}. Маржа на тонну ${d(A.mar/A.sal,B.mar/B.sal)>=0?'выросла':'упала'} на ${nf(Math.abs(d(A.mar/A.sal,B.mar/B.sal)))} ₽/т.`,
      `Наибольший сдвиг в структуре затрат: ${(()=>{const ar=[['производство',A.pd,B.pd],['логистика',A.mv,B.mv],['закупки',A.pc,B.pc],['хранение',A.st,B.st]].sort((x,y)=>Math.abs(y[2]-y[1])-Math.abs(x[2]-x[1]))[0];return `<span class="h">${ar[0]}</span> — с ${bn(ar[1])} до ${bn(ar[2])}`})()}.`]},
    {t:'Какой вариант эффективнее по блокам',i:verdict.map(v=>
      `<b>${v.name}</b>: ${v.better==='='?'без изменений':`выигрывает версия <span class="h">${v.better}</span>`}`)},
    {t:'Итоговый вывод и рекомендации',i:[
      winB>winA?`<span class="h">Версия B предпочтительнее</span> — лучше по ${winB} блокам из ${verdict.length}. Её можно принимать за базовый план при условии, что рост показателей не достигнут за счёт нереалистичных допущений: проверьте блок «Качество данных».`
        :winA>winB?`<span class="h">Версия A предпочтительнее</span> — лучше по ${winA} блокам из ${verdict.length}. Изменения в версии B ухудшили результат, необходимо разобрать, какие вводные вызвали регресс.`
        :`Версии сопоставимы по числу выигранных блоков — решение принимать по приоритетному блоку: обычно маржа, затем Service Level.`,
      `Если маржа выросла, а Service Level упал — это перераспределение объёма в пользу дорогих позиций. Управленческое решение: приемлемо ли снижение обслуживания клиентов ради маржи.`,
      `Если снизилась логистика, но выросло хранение — затраты просто переехали между статьями. Сравнивать нужно сумму, а не отдельные блоки.`,
      `Фиксировать версию перед каждым значимым изменением вводных: мощности, тарифы, цены. Так эффект каждого решения будет измерим.`]}]);
}

/* ═══════════════ 15. БЛОК: КАЧЕСТВО ДАННЫХ ═══════════════ */
function tabDQ(){
  const o=DS.orders,ops=DS.ops,ch=[];
  const add=(sev,tag,msg,rec)=>ch.push({sev,tag,msg,rec});

  const bad1=o.filter(x=>Math.abs(x.sal+x.unm-x.dem)>.01);
  add(bad1.length?'e':'i','Баланс спроса',
    bad1.length?`${bad1.length} заказов: план продаж плюс неудовлетворённый спрос не равны плану спроса, например №${bad1[0].id}.`
      :`Все ${o.length} заказов: план продаж плюс неудовлетворённый спрос равны плану спроса.`,
    bad1.length?'Проверить выгрузку оптимизатора — нарушен базовый инвариант модели.':'Инвариант соблюдён, данные пригодны для расчёта Service Level.');

  const bad2=o.filter(x=>Math.abs(x.sal*x.price-x.rev)>Math.max(1,x.rev*1e-6));
  add(bad2.length?'e':'i','Выручка',
    bad2.length?`${bad2.length} заказов: выручка не равна произведению плана продаж на цену.`:'Выручка сходится с произведением продаж на цену во всех заказах.',
    bad2.length?'Уточнить наличие скидок и надбавок, не отражённых в поле цены за тонну.':'Расчёт выручки корректен.');

  const bad3=o.filter(x=>Math.abs(x.rev-x.cost-x.mar)>Math.max(1,x.rev*1e-6));
  add(bad3.length?'e':'i','Маржа',
    bad3.length?`${bad3.length} заказов: маржа не равна разнице выручки и себестоимости.`:'Маржа сходится с разницей выручки и себестоимости.',
    bad3.length?'Проверить знаки и полноту состава себестоимости.':'Финансовая логика непротиворечива.');

  const an=o.filter(x=>x.cpt<x.price*.01);
  add(an.length?'e':'i','Аномальная себестоимость',
    an.length?`${an.length} ${plural(an.length,['заказ','заказа','заказов'])} с себестоимостью менее 1% от цены: ${an.slice(0,3).map(x=>'№'+x.id+' '+x.prod+' — '+nf(x.cpt)+' ₽/т при цене '+nf(x.price)).join(' | ')}.`
      :'Заказов с аномально низкой себестоимостью не выявлено.',
    an.length?'Искажает рейтинг маржинальности. Причина обычно в отпуске со склада без разузлования до сырья. Исключить из рейтингов или помечать флагом неполной себестоимости.':'—');

  const flat=grp(o,x=>x.prod,v=>({u:uq(v,z=>z.price).length,p:uq(v,z=>z.p).length})).filter(x=>x.p>1&&x.u===1);
  add(flat.length?'w':'i','Индексация цен',
    flat.length?`${flat.length} ${plural(flat.length,['продукт','продукта','продуктов'])} имеют одинаковую цену во всех периодах: ${flat.slice(0,4).map(f=>f.k).join(' | ')}. При этом закупочные тарифы растут.`
      :'Цены изменяются по периодам.',
    flat.length?'Заложить индексацию отпускных цен, иначе маржа к концу горизонта систематически занижена, а решения смещены в сторону раннего исполнения.':'—');

  const stub=ops.filter(r=>r.stub);
  const stubRate=stub.length/Math.max(ops.length,1);
  add(stubRate>.1?'w':'i','Тарифы-заглушки',
    `${stub.length} из ${ops.length} операций (${pc(stubRate)}) имеют ставку не более 1 ₽/т, в основном ${uq(stub,r=>r.tm).filter(x=>x).slice(0,4).join(', ')||'перемещения без тарифа'}.`,
    'Стоимостные метрики по этим строкам исключены из расчёта, поэтому затраты цепочки недооценены. Заполнить реальные ставки либо вынести в отдельную статью условий поставки.');

  add('w','Незаполненные поля',
    'Поля «Тип спроса», «Потреблённый запас», «late_delivery», «mapper_run_id» пусты во всей выгрузке.',
    'Без них недоступны сегментация спроса, оборачиваемость запасов и метрика своевременности. Запросить заполнение у владельца модели.');

  const mixed=ops.filter(r=>r.type==='movement'&&r.rs);
  add('w','Смешение сущностей',
    `Поле «Тип транспорта» объединяет виды транспорта (RAIL, TRUCK, SHIP) с условиями поставки (PLANTFCA) и операциями терминала (PORTHANDL). Поле «Ресурс» в строках перемещения содержит локации${mixed.length?', '+mixed.length+' строк':''}.`,
    'Разделить на независимые атрибуты: вид транспорта, тип операции сети, базис поставки. Поле «Ресурс» оставить только для производственных строк.');

  const dup=grp(ops.filter(r=>r.type==='production'),r=>r.o+'|'+r.rt+'|'+r.pr+'|'+r.v,v=>({n:v.length})).filter(x=>x.n>1);
  add(dup.length?'w':'i','Дубли объёма по мультиресурсу',
    dup.length?`${dup.length} групп производственных операций дублируются по нескольким ресурсам с одинаковым объёмом.`
      :'Дублей мультиресурсных операций не обнаружено.',
    dup.length?'При суммировании объёма выпуска обязательна дедупликация по order_operation_id, иначе производство завышается кратно числу ресурсов.':'—');

  const hasRC=ops.some(r=>r.rc);
  add('e','Отсутствуют мощности ресурсов',
    hasRC?'Есть потреблённые машино-часы, но нет доступной мощности ресурсов по периодам.'
      :'Нет ни потребления, ни мощности ресурсов.',
    'Без мощности невозможно рассчитать утилизацию и найти узкие места — ключевую метрику производственного планирования. Добавить справочник «ресурс, период, доступные часы».');

  const synth=uq(o,x=>x.dem).length===1;
  add(synth?'w':'i','Реалистичность спроса',
    synth?`Все заказы имеют одинаковый план спроса — ${nf(o[0].dem)} т. Это признак тестового набора.`
      :'План спроса варьируется по заказам, набор выглядит реальным.',
    synth?'Не переносить абсолютные значения в управленческую отчётность до валидации на фактическом спросе.':'—');

  const geo=['Вьетнам','Турция','Южная Америка','Китай','Индия'].filter(g=>o.some(x=>x.cl===g));
  const nOther=o.filter(x=>x.cl==='Прочие').length;
  add(geo.length||nOther?'w':'i','Справочник клиентов',
    (geo.length?`Поле «Клиент» смешивает юрлица и географии: ${geo.join(', ')}. `:'')
    +(nOther?`Присутствует агрегат «Прочие» — ${nOther} ${plural(nOther,['заказ','заказа','заказов'])}, ${pc(nOther/o.length)} портфеля.`:''),
    'Ввести два независимых измерения: клиент и рынок или регион. Распаковать «Прочие» минимум до топ-10 контрагентов, иначе клиентская аналитика искажена.');

  const ps=uq(o,x=>x.p).sort((a,b)=>a-b);
  const gaps=[];for(let i=ps[0];i<=ps[ps.length-1];i++)if(!ps.includes(i))gaps.push(i);
  add(gaps.length?'w':'i','Покрытие горизонта',
    gaps.length?`Загружены периоды ${ps.join(', ')}. Отсутствуют: ${gaps.join(', ')} — тренды и сезонность считаются по неполному горизонту.`
      :`Горизонт непрерывен: периоды с ${ps[0]} по ${ps[ps.length-1]}, всего ${ps.length}.`,
    gaps.length?'Догрузить полный файл: выводы о динамике маржи и тарифов на разрывном горизонте ненадёжны.':'—');

  const maxDp=Math.max(...ops.map(r=>r.dp||0),0);
  add(maxDp>=9?'w':'i','Глубина разузлования',
    `Максимальная глубина дерева операций — ${maxDp} уровней. Операций с глубиной семь и более: ${ops.filter(r=>(r.dp||0)>=7).length}.`,
    maxDp>=9?'Глубокие цепочки каскадно накапливают стоимость и делают себестоимость чувствительной к ошибке на нижнем уровне. Проверить корректность коэффициентов расхода.':'—');

  const stR=uq(ops.filter(r=>r.type==='stock'),r=>Math.abs(r.r));
  add(stR.length===1?'w':'i','Ставки хранения',
    ops.some(r=>r.type==='stock')
      ?(stR.length===1?`Все операции хранения имеют единую ставку ${nf(stR[0])} ₽/т за период.`:`Ставки хранения варьируются: ${stR.length} различных значений.`)
      :'Операции хранения в выгрузке отсутствуют.',
    stR.length===1?'Дифференцировать ставки по типу склада и продукта: модель не различает дешёвый навал и дорогое условное хранение.':'—');

  const pcO=ops.filter(r=>r.type==='procurement');
  const single=grp(pcO,r=>r.pr,v=>({vd:uq(v,x=>x.vd).length,c:S(v,x=>x.cost)})).filter(x=>x.vd===1).sort((a,b)=>b.c-a.c);
  add(single.length?'w':'i','Риск единственного источника',
    single.length?`${single.length} ${plural(single.length,['материал','материала','материалов'])} закупаются у единственного поставщика. Крупнейшие по затратам: ${single.slice(0,3).map(s=>s.k+' — '+bn(s.c)).join(' | ')}.`
      :'Все материалы имеют альтернативные источники.',
    single.length?'Риск срыва поставки не хеджирован. Инициировать квалификацию второго вендора по позициям с наибольшими затратами.':'—');

  const errs=ch.filter(c=>c.sev==='e').length, warns=ch.filter(c=>c.sev==='w').length, oks=ch.filter(c=>c.sev==='i').length;
  const score=Math.max(0,Math.round(100-errs*13-warns*5));
  const SEV={e:['Критично',CH.err],w:['Предупреждение','#c47512'],i:['Норма',CH.ok]};

  const html=`
  <div class="dq i" style="margin-bottom:14px"><span class="tag">Область анализа</span>
    <div class="m">Проверки выполняются по <b>всему загруженному набору</b>: ${o.length} заказов и ${ops.length} операций.
    Они не зависят от активных фильтров — качество данных оценивается целиком.</div></div>
  <div class="kpis">
    ${[['Индекс качества данных',score+' из 100',errs+' критических, '+warns+' предупреждений',score>=75?'pos':score>=50?'mid':'neg'],
       ['Проверок выполнено',nf(ch.length),oks+' пройдено успешно',''],
       ['Заказов в наборе',nf(o.length),uq(o,x=>x.p).length+' периодов | '+uq(o,x=>x.prod).length+' продуктов',''],
       ['Операций в наборе',nf(ops.length),uq(ops,r=>r.type).length+' типов операций',''],
       ['Покрытие затрат',pc(1-stubRate),'строк с реальным тарифом',stubRate>.2?'neg':stubRate>.1?'mid':'pos'],
       ['Пустых атрибутов',nf(4),'из выгрузки не используются','mid']]
      .map(k=>`<div class="kpi"><div class="t">${k[0]}</div><div class="v ${k[3]}">${k[1]}</div><div class="s">${k[2]}</div></div>`).join('')}
  </div>
  <div class="grid">
    <div class="card"><h3>Профиль проверок</h3><div class="sub">Распределение результатов по уровню критичности</div><canvas id="q1"></canvas></div>
    <div class="card"><h3>Покрытие затрат по типам операций</h3><div class="sub">Доля строк с реальным тарифом</div><canvas id="q2"></canvas></div>
    <div class="card w"><h3>Реестр проверок и рекомендаций</h3><div class="sub">Отсортировано по критичности</div><div id="q3"></div></div>
    <div class="card w"><h3>Заполненность атрибутов выгрузки</h3><div class="sub">Доля непустых значений в релевантных строках</div><canvas id="q4"></canvas></div>
  </div>`;

  setTimeout(()=>{
    chDonut('#q1',H('#q1',240,0.55),[
      {k:'Критично',v:errs||0.001,c:CH.err},{k:'Предупреждение',v:warns||0.001,c:CH.warn},{k:'Норма',v:oks||0.001,c:CH.ok}
    ],'Проверки',v=>nf(Math.round(v))+' шт',null);

    const cov=grp(ops,r=>r.type,v=>({ok:v.filter(x=>!x.stub).length,n:v.length}))
      .map(t=>({k:t.k,v:t.ok/Math.max(t.n,1),n:t.n,ok:t.ok})).sort((a,b)=>a.v-b.v);
    chH('#q2',H('#q2',240,0.5),cov.map(c=>({k:c.k,v:c.v*100,c:c.v>.85?CH.ok:c.v>.6?CH.warn:CH.err,
      tip:`<b>${c.k}</b><br>С реальным тарифом: ${c.ok} из ${c.n}<br>Покрытие: ${pc(c.v)}<br>Без стоимости: ${c.n-c.ok} строк`})),
      v=>nf(v,0)+'%',null);

    $('#q3').innerHTML=ch.slice().sort((a,b)=>({e:0,w:1,i:2})[a.sev]-({e:0,w:1,i:2})[b.sev]).map(c=>
      `<div class="dq ${c.sev}"><span class="tag" style="color:${SEV[c.sev][1]};border-color:${SEV[c.sev][1]}">${SEV[c.sev][0]}</span>
       <div class="m"><b>${c.tag}.</b> ${c.msg}${c.rec&&c.rec!=='—'?`<br><span style="color:var(--scp-text-3)">Рекомендация: ${c.rec}</span>`:''}</div></div>`).join('');

    const fields=[
      ['Локация производства',ops.filter(r=>r.type==='production'||r.type==='stock'),r=>r.pl],
      ['Ресурс',ops.filter(r=>r.type==='production'),r=>r.rs],
      ['Маршрут или рецепт',ops.filter(r=>r.type==='production'),r=>r.rt],
      ['Машино-часы',ops.filter(r=>r.type==='production'),r=>r.rc],
      ['Поставщик',ops.filter(r=>r.type==='procurement'),r=>r.vd],
      ['Плечо откуда и куда',ops.filter(r=>r.type==='movement'),r=>r.fr&&r.to],
      ['Тариф без заглушки',ops,r=>!r.stub],
      ['Тип спроса',ops,()=>false],
      ['Потреблённый запас',ops,()=>false],
      ['late_delivery',ops,()=>false]
    ].map(f=>({k:f[0],v:f[1].length?f[1].filter(f[2]).length/f[1].length*100:0}));
    chBars('#q4',H('#q4',270,0.28,230,350),fields.map(f=>f.k),[{c:CH.d1,v:fields.map(f=>f.v)}],v=>nf(v,0)+'%',
      i=>`<b>${fields[i].k}</b><br>Заполнено: ${nf(fields[i].v,1)}% релевантных строк${fields[i].v===0?'<br>Поле не используется':''}`,
      null,1);
  },0);

  const topRec=ch.filter(c=>c.sev==='e').concat(ch.filter(c=>c.sev==='w')).slice(0,4);
  return html+summary('Резюме: качество данных',[
    {t:'Общая оценка',i:[
      `Индекс качества данных — <span class="h">${score} из 100</span>: ${errs} критических нарушений, ${warns} предупреждений, ${oks} проверок пройдено.`,
      `Базовые финансовые инварианты (баланс спроса, выручка, маржа) ${bad1.length||bad2.length||bad3.length?'<span class="h">нарушены</span>. Использовать данные для принятия решений нельзя до исправления':'соблюдены. Агрегированные финансовые показатели можно считать достоверными'}.`,
      `Стоимостное покрытие операций: <span class="h">${pc(1-stubRate)}</span>. Остаток приходится на строки с тарифом-заглушкой, поэтому полная себестоимость цепочки занижена.`,
      `Ключевой пробел для планирования — <span class="h">отсутствие мощностей ресурсов</span>. Без них производственный блок остаётся описательным, узкие места не выявляются.`]},
    {t:'Приоритетные действия в порядке влияния',i:topRec.map((c,i)=>
      `<b>${i+1}. ${c.tag}</b> — ${c.rec}`)},
    {t:'Как улучшить процесс подготовки данных',i:[
      `Внедрить автоматические <span class="h">проверки выгрузки</span>: три инварианта — баланс спроса, выручка равна объёму на цену, маржа равна разнице выручки и себестоимости — должны проверяться до публикации файла.`,
      `Разделить выгрузку на <span class="h">два уровня</span>: заказы и операции. Сейчас финансы дублируются на каждой строке операции, что провоцирует двойной счёт.`,
      `Нормализовать справочники: клиент отдельно от региона, вид транспорта отдельно от базиса поставки, ресурс отдельно от локации, маршрут отдельно от поставщика.`,
      `Добавить отсутствующие сущности: мощности ресурсов, расстояния и время в пути, остатки запасов, минимальные партии закупки. Каждая открывает целый класс метрик.`,

function drawBox(x,bx,by,bw,bh,r){
  if(x.roundRect){x.beginPath();x.roundRect(bx,by,bw,bh,r)}
  else{x.beginPath();x.moveTo(bx+r,by);x.lineTo(bx+bw-r,by);
    x.quadraticCurveTo(bx+bw,by,bx+bw,by+r);x.lineTo(bx+bw,by+bh-r);
    x.quadraticCurveTo(bx+bw,by+bh,bx+bw-r,by+bh);x.lineTo(bx+r,by+bh);
    x.quadraticCurveTo(bx,by+bh,bx,by+bh-r);x.lineTo(bx,by+r);
    x.quadraticCurveTo(bx,by,bx+r,by);x.closePath()}
}
function getLineage(focusedKey,edges){
  if(!focusedKey)return null;
  const upN=new Set([focusedKey]),upE=new Set();let ch=true;
  while(ch){ch=false;edges.forEach((e,i)=>{const s=e.from._key||e.from.id,d=e.to._key||e.to.id;
    if(upN.has(d)&&!upN.has(s)){upN.add(s);upE.add(i);ch=true}})}
  const dnN=new Set([focusedKey]),dnE=new Set();ch=true;
  while(ch){ch=false;edges.forEach((e,i)=>{const s=e.from._key||e.from.id,d=e.to._key||e.to.id;
    if(dnN.has(s)&&!dnN.has(d)){dnN.add(d);dnE.add(i);ch=true}})}
  return {activeNodes:new Set([...upN,...dnN]),activeEdgeIdxs:new Set([...upE,...dnE])};
}
function optimizeEdges(rawEdges){
  const m=new Map();
  rawEdges.forEach(e=>{const k=(e.from._key||e.from.id)+'->'+(e.to._key||e.to.id);if(!m.has(k))m.set(k,e)});
  let edges=[...m.values()];
  const adj=new Map();
  edges.forEach(e=>{const u=e.from._key||e.from.id,v=e.to._key||e.to.id;
    if(!adj.has(u))adj.set(u,new Set());adj.get(u).add(v)});
  return edges.filter(e=>{const u=e.from._key||e.from.id,v=e.to._key||e.to.id;
    for(const w of (adj.get(u)||new Set())){if(w!==v&&(adj.get(w)||new Set()).has(v))return false}
    return true});
}
function drawTreeEdges(x,edges,lineage,isCost){
  edges.forEach((e,idx)=>{
    const hl=lineage?lineage.activeEdgeIdxs.has(idx):false;
    const dim=lineage?!hl:false;
    const sx=e.from.x,sy=e.from.y+e.from.h/2,ex=e.to.x+e.to.w,ey=e.to.y+e.to.h/2;
    const dx=Math.max(Math.abs(sx-ex)*.48,28);

    x.beginPath();x.moveTo(sx,sy);x.bezierCurveTo(sx-dx,sy,ex+dx,ey,ex,ey);
    if(hl){x.strokeStyle=CH.brand;x.lineWidth=2.2;x.setLineDash([])}
    else if(dim){x.strokeStyle=CH.dim;x.lineWidth=1;x.setLineDash([])}
    else if(isFinal){x.strokeStyle=rgba(isCost?CH.d3:CH.d1,.75);x.lineWidth=1.8;x.setLineDash([])}
    else{x.strokeStyle=rgba(CH.d2,.55);x.lineWidth=1.2;x.setLineDash([4,3])}
    x.stroke();x.setLineDash([]);
    const aL=hl?7:5,aW=hl?3.5:2.5;
    x.fillStyle=hl?CH.brand:(dim?CH.dim:(isFinal?(isCost?CH.d3:CH.d1):CH.d2));
    x.beginPath();x.moveTo(ex,ey);x.lineTo(ex+aL,ey-aW);x.lineTo(ex+aL-1.2,ey);x.lineTo(ex+aL,ey+aW);
    x.closePath();x.fill();
    const hasVal=isCost?(e.cost>0):(e.vol>0);
    if((isFinal||hl||e.from._isGroup)&&!dim&&hasVal){
      const mx=(sx+ex)/2,my=(sy+ey)/2-12;
      const txt=isCost?(e.cost>=1e6?mln(e.cost):nf(Math.round(e.cost))+' ₽'):(nf(e.vol,e.vol<10?2:1)+' т');
      x.font='600 9.5px '+FNT;const tw=x.measureText(txt).width+10;
      x.fillStyle=CH.surf;drawBox(x,mx-tw/2,my-7.5,tw,15,3);x.fill();
      x.strokeStyle=hl?CH.brand:CH.line;x.lineWidth=1;x.stroke();
      x.fillStyle=hl?CH.brand:CH.lab;x.textAlign='center';x.textBaseline='middle';x.fillText(txt,mx,my);
    }
  });
}

}

function chSupplyTreeStandard(g,ops,ord){
  const {c,x,w,h}=g;
  const p={l:26,r:26,t:50,b:26};
  const isCost=(TREE_METRIC_MODE==='cost');
  const T_COLOR={production:CH.d3,movement:CH.d1,procurement:CH.d4,stock:CH.d6};
  if(!ops.length){x.fillStyle=CH.axis;x.textAlign='center';x.font='13px '+FNT;
    x.fillText('Нет операций выбранного типа для этого заказа',w/2,h/2);bind(c);return}
  const byOid=new Map();
  ops.forEach(o=>{const k=o.oid||('GEN_'+(o.dp||1)+'_'+(o.pr||o.tm));
    if(!byOid.has(k))byOid.set(k,{...o,_key:k})});
  byOid.forEach(node=>{
    let pk=null;
    if(node.oid){
      if(node.type==='procurement'&&node.oid.endsWith('.B')){
        const mo=node.oid.slice(0,-2)+'.A';if(byOid.has(mo))pk=mo}
      if(!pk&&node.type==='production'){
        const mm=[...byOid.values()].find(o=>o.type==='movement'&&o.fr===node.pl&&o.pr===node.pr&&o.oid!==node.oid);
        if(mm)pk=mm._key}
      if(!pk){const parts=node.oid.split('.');
        for(let l=parts.length-1;l>=1;l--){const cand=parts.slice(0,l).join('.');
          if(byOid.has(cand)){pk=cand;break}}}
      if(!pk&&node.oid!=='A'&&byOid.has('A'))pk='A';
    }
    node._parentKey=pk});
  const depths=[...new Set([...byOid.values()].map(o=>o.dp||(o.oid?o.oid.split('.').length:1)))].sort((a,b)=>a-b);
  const numCols=Math.max(depths.length,1);
  const colW=(w-p.l-p.r)/numCols,nodeW=Math.min(colW*.78,152),nodeH=36,availH=h-p.t-p.b;
  const nodes=[];

    const stepY=availH/Math.max(colNodes.length,1);

      node.x=p.l+ci*colW+(colW-nodeW)/2;node.y=p.t+ri*stepY+(stepY-nodeH)/2;
      node.w=nodeW;node.h=nodeH;node._col=ci+1;node.title=node.pr||node.tm;
      const isRoot=(node.oid==='A'||node._col===1);
      if(isCost){
        if(isRoot){node.sub=`Полная с/с: ${mln(ord.cost)}`;node.color=CH.d3}
        else{node.sub=(node.cost>0)?`${mln(node.cost)} (${pc(node.cost/ord.cost)})`:'0 ₽';
          node.color=T_COLOR[node.type]||CH.d1}
      }else{
        node.sub=node.pl||node.vd||(node.fr?`${node.fr} → ${node.to}`:`${nf(node.v,1)} т`);
        node.color=T_COLOR[node.type]||CH.d1}
      node.tip=`<b>${node.type} · уровень ${node._col}</b>`
        +(node.oid?`<br>ID в BOM: <code>${node.oid}</code>`:'')
        +`<br>Материал: ${node.pr||'—'}`
        +`<br>Объём операции: ${nf(node.v,2)} т (${pc(node.v/ord.sal)} от заказа)`
        +(isRoot?`<br>Полная себестоимость заказа: <b>${mln(ord.cost)} ₽</b>`
          :`<br>Затраты статьи: <b>${node.cost?mln(node.cost)+' ₽':'0 ₽'}</b> (${pc((node.cost||0)/ord.cost)} от с/с)`)
        +(node.pl?`<br>Площадка: ${node.pl}`:'')
        +(node.rs?`<br>Ресурс: ${node.rs}`:'')
        +(node.fr?`<br>Маршрут: ${node.fr} → ${node.to} (${node.tm||'плечо'})`:'')
        +(node.vd?`<br>Поставщик: ${node.vd}`:'')
        +(node.rt?`<br>Рецепт: ${node.rt}`:'')
        +`<br>Тариф: ${node.stub?'0 ₽ (заглушка)':nf(node.r)+' ₽/т'}`
        +(node.rc?`<br>Машино-часы: ${nf(node.rc,2)} ч`:'');
      nodes.push(node)})});
  const nodeMap=new Map(nodes.map(n=>[n._key,n]));
  const rawEdges=[];
  nodes.forEach(n=>{if(n._parentKey&&nodeMap.has(n._parentKey))

  const edges=optimizeEdges(rawEdges);
  x.fillStyle=CH.lab;x.font='600 11.5px '+FNT;x.textAlign='center';
  for(let d=1;d<=numCols;d++){const cx=p.l+(d-1)*colW+colW/2;
    x.fillText(isCost?(d===1?'1. Итог себестоимости':'Уровень '+d):'Уровень '+d,cx,p.t-22)}
  const lineage=getLineage(TREE_FOCUSED_KEY,edges);
  drawTreeEdges(x,edges,lineage,isCost);
  drawTreeNodes(c,x,nodes,lineage,isCost);
}

    {name:'Валовая выручка',val:ord.rev,c:CH.d1,base:1},
    {name:'Сырьё',val:pcC,c:CH.d4},{name:'Производство',val:pdC,c:CH.d3},
    {name:'Логистика',val:mvC,c:CH.d2},{name:'Хранение',val:stC,c:CH.d6},
    {name:'Валовая маржа',val:ord.mar,c:CH.d3,total:1,margin:1},
    {name:'Полная с/с',val:pcC+pdC+mvC+stC,c:'#8a8f98',ref:1}];
  const wcW=(w-p.l-p.r)/stages.length,wbW=Math.min(wcW*.62,108);
  const maxF=ord.rev*1.28||1,wAvail=h-wfTop-p.b-22;
  let lvl=ord.rev;
  stages.forEach((cs,i)=>{
    const bx=p.l+i*wcW+(wcW-wbW)/2;let by,bh;
    if(cs.base||cs.total||cs.ref){bh=Math.max(wAvail*(cs.val/maxF),12);by=wfTop+wAvail-bh}
    else{bh=Math.max(wAvail*(cs.val/maxF),4);by=wfTop+wAvail-(wAvail*(lvl/maxF));lvl-=cs.val;
      x.strokeStyle=CH.line;x.setLineDash([3,3]);x.beginPath();
      x.moveTo(bx+wbW,by+bh);x.lineTo(bx+wcW,by+bh);x.stroke();x.setLineDash([])}
    x.fillStyle=cs.c;drawBox(x,bx,by,wbW,bh,4);x.fill();
    if(cs.ref){x.strokeStyle=CH.ctrl||'#949598';x.lineWidth=1;x.stroke()}
    x.fillStyle=cs.margin?CH.ok:CH.txt;x.font='700 10.5px '+FNT;
    x.textAlign='center';x.textBaseline='bottom';
    x.fillText(mln(cs.val)+(cs.margin?` (${pc(ord.mar/ord.rev)})`:''),bx+wbW/2,by-5);
    x.fillStyle=CH.lab;x.font='10px '+FNT;x.textBaseline='top';
    x.fillText(cs.name,bx+wbW/2,h-p.b+3);
  });
}

const COL={
  p:['Период спроса'],dt:['marking_demand_optimizer_periods_link_start_date'],
  loc:['Локация спроса'],prod:['Продукт спроса'],cl:['Клиент спроса'],
  dem:['План спроса'],sal:['План продаж'],unm:['Неудовлетворенный спрос','Неудовлетворённый спрос'],
  price:['Цена за тонну'],cpt:['Cебестоимость на тонну','Себестоимость на тонну'],
  mpt:['Маржинальность на тонну'],rev:['Валовая выручка (план продаж)'],
  cost:['Суммарная себестоимость'],mar:['Валовая маржа (план продаж), руб'],
  id:['order_id'],prio:['margin_per_hour'],
  pl:['Локация производства'],rt:['Источник поставки'],oprod:['Продукт производства'],
  rs:['Ресурс'],v:['Размеченный объем операции'],r:['Затраты на тонну'],
  fr:['Локация откуда'],to:['Локация куда'],tm:['Тип транспорта'],
  vd:['Поставщик'],type:['Тип операции'],oid:['order_operation_id'],
  rc:['resource_consumption_operation'],run:['run_id'],cfg:['config_id'],dsid:['dataset_id']
};
function pick(row,keys){for(const k of keys)if(row[k]!==undefined&&row[k]!==null&&row[k]!=='')return row[k];return undefined}
const num=v=>{if(v===undefined||v===null||v==='')return 0;
  const n=typeof v==='number'?v:parseFloat(String(v).replace(/\s/g,'').replace(',','.'));return isFinite(n)?n:0};
const str=v=>v===undefined||v===null?'':String(v).trim();
function fmtDate(v){
  if(v instanceof Date)return v.toISOString().slice(0,7);
  if(typeof v==='number'){const d=new Date(Date.UTC(1899,11,30)+v*864e5);return d.toISOString().slice(0,7)}
  const s=str(v),m=s.match(/(\d{1,2})[\/.](\d{1,2})[\/.](\d{4})/);
  if(m)return m[3]+'-'+String(m[1]).padStart(2,'0');
  const m2=s.match(/(\d{4})-(\d{2})/);return m2?m2[0]:s.slice(0,7);
}
function parseRows(rows,fileName){
  if(!rows.length)throw new Error('Лист пуст');
  const first=rows[0];
  if(pick(first,COL.id)===undefined||pick(first,COL.sal)===undefined)
    throw new Error('Не найдены обязательные столбцы «order_id» и «План продаж». Проверьте, что выбран лист marking_demand.');
  const T2={movement:'mv',production:'pd',procurement:'pc',stock:'st'};
  const seenOrd=new Set(),orders=[],ops=[],seenOp=new Set();
  let runId='',cfg='',dsid='';
  rows.forEach(rw=>{
    const id=num(pick(rw,COL.id));if(!id)return;
    runId=runId||str(pick(rw,COL.run));cfg=cfg||str(pick(rw,COL.cfg));dsid=dsid||str(pick(rw,COL.dsid));
    if(!seenOrd.has(id)){
      seenOrd.add(id);
      const price=num(pick(rw,COL.price)),sal=num(pick(rw,COL.sal));
      let rev=num(pick(rw,COL.rev));if(!rev)rev=sal*price;
      let cost=Math.abs(num(pick(rw,COL.cost)));
      let mar=num(pick(rw,COL.mar));if(!mar)mar=rev-cost;
      orders.push({id,p:num(pick(rw,COL.p)),d:fmtDate(pick(rw,COL.dt)),
        loc:str(pick(rw,COL.loc)),prod:str(pick(rw,COL.prod)),cl:str(pick(rw,COL.cl))||'—',
        dem:num(pick(rw,COL.dem)),sal,unm:num(pick(rw,COL.unm)),price,
        cpt:Math.abs(num(pick(rw,COL.cpt))),mpt:num(pick(rw,COL.mpt)),
        rev,cost,mar,pr:num(pick(rw,COL.prio))||2});
    }
    const t=T2[str(pick(rw,COL.type)).toLowerCase()];if(!t)return;
    const oid=str(pick(rw,COL.oid)),rs=str(pick(rw,COL.rs));
    const key=id+'|'+oid+'|'+rs;if(seenOp.has(key))return;seenOp.add(key);
    ops.push({o:id,p:num(pick(rw,COL.p)),t,
      pl:str(pick(rw,COL.pl)),pr:str(pick(rw,COL.oprod)),rs:(t==='mv'?'':rs),
      fr:str(pick(rw,COL.fr)),to:str(pick(rw,COL.to)),tm:str(pick(rw,COL.tm)),
      v:num(pick(rw,COL.v)),r:Math.abs(num(pick(rw,COL.r))),
      vd:str(pick(rw,COL.vd)),rt:str(pick(rw,COL.rt)),
      oid,dp:oid?oid.split('.').length:1,rc:num(pick(rw,COL.rc))||undefined});
  });
  if(!orders.length)throw new Error('Не удалось распознать ни одного заказа');
  const nm=fileName.replace(/\.(xlsx|xls)$/i,'')+(runId?` | run ${runId}`:'')+(cfg?` | cfg ${cfg}`:'');
  return {name:nm,orders,ops};
}
function loadFile(file){
  if(typeof XLSX==='undefined'){
    alert('Парсер XLSX недоступен: нет доступа к CDN SheetJS.\n\nВарианты:\n1. Открыть страницу при наличии интернета.\n2. Скачать xlsx.full.min.js и подключить локально.');
    return;
  }
  const fr=new FileReader();
  $('#stat').innerHTML='Чтение файла';
  fr.onload=e=>{
    try{
      const wb=XLSX.read(e.target.result,{type:'array',cellDates:true});
      const sh=wb.SheetNames.find(n=>/marking_demand/i.test(n))||wb.SheetNames[0];
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[sh],{defval:'',raw:true});
      DS=build(parseRows(rows,file.name));
      clearF();render();
      $('#stat').innerHTML=`<span class="pos">Загружено:</span> ${esc(DS.name)}<br>${DS.orders.length} заказов | ${DS.ops.length} операций | лист «${esc(sh)}»`;
    }catch(err){
      $('#stat').innerHTML=`<span class="neg">Ошибка: ${esc(err.message)}</span>`;
      alert('Не удалось разобрать файл.\n\n'+err.message);
    }
  };
  fr.onerror=()=>{$('#stat').innerHTML='<span class="neg">Ошибка чтения файла</span>'};
  fr.readAsArrayBuffer(file);
}

/* ═══════════════ 17. РЕНДЕР И ИНИЦИАЛИЗАЦИЯ ═══════════════ */
function go(tab){TAB=tab;render()}
function render(){
  if(!DS){
    $('#nav').innerHTML='';$('#fpanel').style.display='none';
    $('#pgTitle').textContent='Данные не загружены';
    $('#pgSub').textContent='';
    $('#main').innerHTML='<div class="empty"><h2>Данные не загружены</h2>'
      +'<p>Нажмите кнопку загрузки в шапке и выберите файл со структурой листа <code>marking_demand</code>.</p></div>';
    $('#stat').innerHTML='Нет активного датасета';
    return;
  }
  $('#fpanel').style.display='';
  $('#nav').innerHTML=TABS.map(([k,n])=>
    `<button class="${TAB===k?'on':''}" data-t="${k}"><span class="dot"></span><b>${n}</b></button>`).join('');
  $$('#nav button').forEach(b=>b.onclick=()=>go(b.dataset.t));
  const cur=TABS.find(t=>t[0]===TAB)||TABS[0];
  $('#pgTitle').textContent=cur[1];
  $('#pgSub').textContent=TSUB[TAB]||'';
  fillSelects();
  const V={ov:tabOV,dm:tabDM,tree:tabTREE,lg:tabLG,pd:tabPD,pc:tabPC,st:tabST,raw:tabRAW,vs:tabVS,dq:tabDQ};
  try{$('#main').innerHTML=(V[TAB]||tabOV)()}
  catch(err){$('#main').innerHTML=`<div class="empty"><h2 class="neg">Ошибка отрисовки блока</h2><p>${esc(err.message)}</p></div>`;console.error(err)}
  if(!/Загружено/.test($('#stat').innerHTML))
    $('#stat').innerHTML=`${esc(DS.name)}<br>${DS.orders.length} заказов | ${DS.ops.length} операций | периоды ${uq(DS.orders,o=>o.p).sort((a,b)=>a-b).join(', ')}`;
}
const bTheme=$('#bThemeToggle');
if(bTheme)bTheme.onclick=()=>{
  THEME=(THEME==='light')?'dark':'light';
  localStorage.setItem('inplan_theme',THEME);
  syncThemeTokens();
  if(DS)render();
};
$('#bLoad').onclick=()=>$('#fIn').click();
$('#fIn').onchange=e=>{if(e.target.files[0]){loadFile(e.target.files[0]);e.target.value=''}};
$('#bSave').onclick=()=>{if(!DS){alert('Нет данных для сохранения');return}saveVer()};
$('#bReset').onclick=()=>{
  if(!confirm('Сбросить данные и обнулить все дашборды?\n\nСохранённые версии для сравнения останутся.'))return;
  DS=null;TAB='ov';clearF();render();
};
const toggleRail=()=>{
  const app=$('#app'),min=app.classList.toggle('min');
  $('#railToggle').textContent=min?'›':'‹ Свернуть панель';
  setTimeout(()=>{if(DS)render()},220);
};
$('#railToggle').onclick=toggleRail;
const hdrToggle=$('#bRailToggleHdr');
if(hdrToggle)hdrToggle.onclick=toggleRail;
let RT,lastW=0;
function redraw(force){
  const el=document.getElementById('main');
  const w=el?el.clientWidth:innerWidth;
  if(!force&&Math.abs(w-lastW)<16)return;
  lastW=w;clearTimeout(RT);
  RT=setTimeout(()=>{if(DS)render()},200);
}
window.addEventListener('resize',()=>redraw(true));
if(window.ResizeObserver){
  const ro=new ResizeObserver(()=>redraw(false));
  ro.observe(document.getElementById('main'));
}
window.addEventListener('keydown',e=>{
  if(e.key==='Escape'){dtpHide();clearF();if(DS)render()}
});

/* стартуем на демо-наборе */
DS=build(SEED);
render();
</script>
